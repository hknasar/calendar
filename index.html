",{className:"border border-[var(--line)] bg-[var(--surface)] p-4",children:[l("div",{className:"text-[12px] font-bold uppercase tracking-[0.16em] text-[var(--primary)]",children:n}),l("p",{className:"m-0 mt-2 !text-[14px] leading-relaxed text-[var(--text-muted)]",children:t})]},n))}),a("p",{children:[l("strong",{children:"Planning tip:"})," the March break is the longest school break in the first half of the year. If your family plans mudik, decide the travel dates before Ramadan begins, because transport and accommodation fill quickly around Eid."]}),l("h2",{id:"semester-ganjil",children:"Semester Ganjil 2026/2027: July to December 2026"}),l("p",{children:"The odd semester is the starting stretch. It opens with the new school year and MPLS, then settles into regular learning, the mid-semester assessment and break, and the end-of-semester assessment before the December break."}),l("div",{className:"my-6 grid gap-3 font-ui sm:grid-cols-2",children:k1.map(([n,t])=>a("div",{className:"border border-[var(--line)] bg-[var(--surface)] p-4",children:[l("div",{className:"text-[12px] font-bold uppercase tracking-[0.16em] text-[var(--primary)]",children:n}),l("p",{className:"m-0 mt-2 !text-[14px] leading-relaxed text-[var(--text-muted)]",children:t})]},n))}),l("p",{children:"For new students, the first week matters more than the first day. MPLS introduces the school rules, teachers, learning routines, and safety procedures. Parents should keep the first week free from other commitments where possible, so children can settle in without missing orientation activities."}),l("h2",{id:"school-holidays",children:"Key Holidays That Affect School in 2026"}),l("p",{children:"National holidays pause learning in every province, and cuti bersama often extends the break around them. The dates below are the national pattern for schools. Your provincial calendar adds the semester breaks, mid-semester breaks, and any local holidays."}),a("ul",{children:[w1.map(([n,t])=>a("li",{children:[l("strong",{children:n})," — ",t]},n+t)),a("li",{children:[l("strong",{children:"Cuti bersama"})," — the government bridge days around Chinese New Year, Nyepi and Eid al-Fitr, Ascension Day, Eid al-Adha, and Christmas extend several of the breaks above."]})]}),a("div",{className:"my-6 grid gap-3 font-ui sm:grid-cols-2",children:[a("button",{onClick:()=>e(2),className:"group border border-[var(--line)] bg-[var(--surface)] p-4 text-left transition hover:border-[var(--primary)] hover:bg-[var(--primary-soft)]",children:[l("span",{className:"text-[12px] font-bold uppercase tracking-[0.16em] text-[var(--primary)]",children:"Article #2"}),a("span",{className:"mt-2 block text-[17px] font-bold leading-snug",children:["Indonesia public holiday calendar 2026 ",l("span",{"aria-hidden":"true",children:"→"})]}),l("span",{className:"mt-1 block text-[14px] leading-relaxed text-[var(--text-muted)]",children:"The full list of 17 national holidays and 8 cuti bersama days."})]}),a("button",{onClick:()=>e(3),className:"group border border-[var(--line)] bg-[var(--surface)] p-4 text-left transition hover:border-[var(--primary)] hover:bg-[var(--primary-soft)]",children:[l("span",{className:"text-[12px] font-bold uppercase tracking-[0.16em] text-[var(--primary)]",children:"Article #3"}),a("span",{className:"mt-2 block text-[17px] font-bold leading-snug",children:["Islamic calendar 2026 ",l("span",{"aria-hidden":"true",children:"→"})]}),l("span",{className:"mt-1 block text-[14px] leading-relaxed text-[var(--text-muted)]",children:"Ramadan, Eid al-Fitr, and Eid al-Adha dates for school planning."})]})]}),l("h2",{id:"exams",children:"Exams and Assessments in 2026"}),l("p",{children:"School assessment in Indonesia is not a single exam. It is a cycle of smaller assessments, mid-semester assessments, and end-of-semester assessments, plus national and school-level assessments for certain grades. The names can vary by school, but the pattern is broadly the same."}),l("h3",{children:"STS / PTS — mid-semester assessment"}),l("p",{children:"Sumatif Tengah Semester (STS), also widely known as Penilaian Tengah Semester (PTS), checks learning in the middle of the semester. It usually covers the material taught since the start of the semester and helps teachers see what needs revision before the end-of-semester assessment."}),l("h3",{children:"SAS / PAS — end-of-semester assessment"}),l("p",{children:"Sumatif Akhir Semester (SAS), also widely known as Penilaian Akhir Semester (PAS), closes the semester. In the even semester, it is often followed by report cards and, for final-year students, graduation activities. In the odd semester, it is followed by report cards and the end-of-semester break."}),l("h3",{children:"SAT — end-of-year assessment"}),l("p",{children:"Some schools use Sumatif Akhir Tahun (SAT) for the final assessment of the school year, especially where the even-semester assessment also serves as the year-end assessment. Your school calendar will show which term it uses."}),l("h3",{children:"Asesmen Nasional"}),l("p",{children:"Asesmen Nasional is a national assessment for sampled students at certain grade levels. It focuses on literacy, numeracy, and the learning environment, rather than ranking every student. Schools receive the schedule and the sampled grades from the education authorities, so exact dates and participating grades vary."}),l("h3",{children:"US / UKK for SMK"}),l("p",{children:"For vocational schools (SMK), Ujian Sekolah (US) and Uji Kompetensi Keahlian (UKK) assess subject mastery and vocational competency. UKK is especially important for SMK students because it tests the practical skills tied to their study programme. Dates and competency packages are set by the school and the relevant authorities."}),l("h3",{children:"PPDB / SPMB enrolment"}),l("p",{children:"Enrolment for the new school year generally runs from May to July, with the main PPDB / SPMB (Penerimaan Peserta Didik Baru / Sistem Penerimaan Murid Baru) period before the new school year starts in mid-July. The exact registration windows, pathways, documents, and announcement dates are set by each province and school. Start checking the official enrolment information in May, and do not rely on last year's dates."}),a("aside",{className:"my-6 border-l-4 border-[var(--primary)] bg-[var(--primary-soft)] px-5 py-4 font-ui text-[0.95rem] leading-relaxed",children:[l("strong",{children:"Check before you plan:"})," assessment weeks, Asesmen Nasional schedules, and PPDB / SPMB windows are set by province and school. Use the pattern in this article for planning, then confirm the exact dates in your school's kalender pendidikan."]}),l("h2",{id:"how-to-plan",children:"How To Plan With This Calendar"}),l("h3",{children:"For parents"}),l("p",{children:"Book mudik early for the two biggest school breaks: the March Eid al-Fitr break and the late June to early July end-of-year break. If you plan a family trip outside those breaks, check the PTS / PAS weeks first — a trip in assessment week creates avoidable stress for children and teachers. For enrolment, keep May to July free for registration, document checks, and announcements."}),l("h3",{children:"For teachers"}),l("p",{children:"Plan the syllabus around Ramadan and the assessment calendar, not just around the number of weeks. February and March have shorter or interrupted learning time, while April, September, and November offer longer uninterrupted stretches. Build revision into the week before each assessment, and keep the week after the assessment for feedback and catch-up before moving on."}),l("h3",{children:"For students"}),l("p",{children:"Work backwards from the assessment weeks. For PTS, revise in short daily sessions in the two weeks before the assessment. For PAS, start earlier and focus on the topics you found hardest during the semester. Use the mid-semester break and the December break for rest first, then for light revision — a break that is only revision is not a break."}),l("h2",{id:"important-note",children:"Important Note"}),l("p",{children:"Exact dates differ by province. This article shows the national pattern for 2026. The provincial Dinas Pendidikan calendar sets the first day of school, MPLS, assessment weeks, semester breaks, and any local holidays. Your school may then adjust a few days for its own activities, exams, or events."}),l("p",{children:"Before you book travel, enrolment, tutoring, or events, check the official kalender pendidikan for your province and confirm the dates with your school. If the provincial calendar and a school notice disagree, follow the school notice for your child's class."}),l("div",{className:"my-6 grid gap-3 font-ui sm:grid-cols-2",children:[1,2,3,4,6,7,8,9,10].map((n)=>a("button",{onClick:()=>e(n),className:"group border border-[var(--line)] bg-[var(--surface)] p-4 text-left transition hover:border-[var(--primary)] hover:bg-[var(--primary-soft)]",children:[a("span",{className:"text-[12px] font-bold uppercase tracking-[0.16em] text-[var(--primary)]",children:["Article #",n]}),a("span",{className:"mt-2 block text-[16px] font-bold leading-snug",children:[Er[n-1]," ",l("span",{"aria-hidden":"true",children:"→"})]})]},n))}),a("div",{className:"mt-10 border border-[var(--line)] bg-[var(--surface-muted)] p-5 font-ui",children:[l("p",{className:"m-0 !text-[13px] font-bold uppercase tracking-[0.18em] text-[var(--text-muted)]",children:"Next in the series"}),a("button",{onClick:()=>e(6),className:"mt-2 flex w-full items-center justify-between gap-3 text-left text-[20px] font-bold leading-tight hover:text-[var(--primary)]",children:[l("span",{children:"Balinese calendar 2026"}),l(ue,{className:"shrink-0"})]})]})]})}var E1=[["18 March","Wednesday","Cuti Bersama — Nyepi"],["19 March","Thursday","Libur Nasional — Nyepi"],["20 March","Friday","Cuti Bersama — Eid al-Fitr"],["21 March","Saturday","Libur Nasional — Eid al-Fitr, Day 1"],["22 March","Sunday","Libur Nasional — Eid al-Fitr, Day 2"],["23 March","Monday","Cuti Bersama — Eid al-Fitr"],["24 March","Tuesday","Cuti Bersama — Eid al-Fitr"]],C1=[["1 Ramadan · around 18–19 February","Ramadan begins. The Indonesian isbat date is 19 February, while astronomical calculation points to 18 February. The first fast follows the determination used by your family, mosque, school, or workplace."],["Nuzulul Quran · 7 March","17 Ramadan. Many communities mark the revelation of the Quran with study, reflection, and communal prayer."],["Last 10 nights · 11–19 March","21–29 Ramadan. Many Muslims increase night prayer, Quran reading, and charity in the search for Laylatul Qadr, the Night of Decree."],["Zakat fitrah · before shalat Ied","Pay zakat fitrah before Eid prayer, through a mosque, amil, or trusted channel, so it reaches recipients in time for Eid."],["Shalat Ied · morning of 21 March","Eid prayer in the morning, usually at a mosque or open field, followed by the sermon, family visits, and halal bihalal."],["Open house and halal bihalal · 21–24 March","The main window for family visits, open houses, and asking and giving forgiveness, before work and school resume."]];var P1=[["Imsak","04:31"],["Subuh","04:41"],["Terbit","05:55"],["Dhuha","06:22"],["Dzuhur","12:10"],["Ashar","15:20"],["Maghrib / Iftar","18:18"],["Isya","19:28"]];var z1=[["19 Mar","Thursday","Nyepi — Saka New Year 1948"],["4 Apr","Saturday","Saraswati"],["8 Apr","Wednesday","Pagerwesi"],["17 Jun","Wednesday","Galungan"],["27 Jun","Saturday","Kuningan"],["31 Oct","Saturday","Saraswati (second)"],["4 Nov","Wednesday","Pagerwesi (second)"]];function _1({goTo:e}){return a("article",{className:"article-body font-serif-article",children:[a("div",{className:"border-t-[3px] border-[var(--primary)] pt-5",children:[l("p",{className:"font-ui text-[12px] font-bold uppercase tracking-[0.22em] text-[var(--primary)]",children:"Saka · Pawukon · Bali"}),l("p",{className:"mt-4 !text-[clamp(1.85rem,5vw,3.4rem)] font-bold leading-[1.05] tracking-[-0.035em]",children:"Balinese calendar"}),l("p",{className:"font-ui !text-[1.05rem] leading-relaxed text-[var(--text-muted)]",children:"Nyepi, Galungan, Kuningan, Saraswati, and Pagerwesi — the holy days, the two calendars behind them, and how to plan around them."}),a("div",{className:"mt-5 flex flex-wrap items-center gap-x-5 gap-y-2 border-y border-[var(--line)] py-3 font-ui text-[13px] text-[var(--text-muted)]",children:[a("span",{className:"inline-flex items-center gap-2",children:[l(ie,{size:16})," Saka 1948 · Pawukon 210 days"]}),a("span",{className:"inline-flex items-center gap-2",children:[l(oe,{size:16})," Nyepi · 19 Mar 2026"]}),a("span",{className:"inline-flex items-center gap-2",children:[l(pe,{size:16})," Bali, Indonesia"]})]})]}),l(nn,{n:6}),l("p",{className:"mt-8",children:"The Balinese calendar combines the Saka lunar calendar and the 210-day Pawukon calendar. The biggest 2026 dates are Nyepi, the Saka New Year 1948, on Thursday 19 March 2026, Galungan on Wednesday 17 June 2026, Kuningan on Saturday 27 June 2026, Saraswati on Saturday 4 April 2026 and again on Saturday 31 October 2026, and Pagerwesi on Wednesday 8 April 2026 and again on Wednesday 4 November 2026."}),l("p",{children:"Most people searching for this are travellers, expats, and Balinese Hindus who want to know when Bali is silent for Nyepi, when temples celebrate Galungan and Kuningan, when schools close for Saraswati and Pagerwesi, and when to avoid or join ceremonies. This article gives you the full 2026 Balinese holy days, how the two calendars work, and practical travel rules."}),l("p",{children:"Bali uses three systems at once: the Gregorian calendar for work and school, the Saka calendar for Nyepi and lunar holy days, and the Pawukon calendar for Galungan, Kuningan, Saraswati, Pagerwesi and Tumpek days. That is why Galungan and Saraswati move each Gregorian year but always repeat every 210 days."}),l("div",{className:"my-8 grid gap-3 font-ui sm:grid-cols-3",children:[["19 Mar","Nyepi — Saka New Year 1948"],["17 Jun","Galungan"],["210","days in the Pawukon cycle"]].map(([n,t])=>a("div",{className:"border border-[var(--line)] bg-[var(--surface-muted)] px-4 py-4",children:[l("div",{className:"text-[2rem] font-bold leading-none tracking-tight",children:n}),l("div",{className:"mt-2 text-[13px] text-[var(--text-muted)]",children:t})]},t))}),l("h2",{id:"complete-list",children:"Complete List: Major Balinese Holy Days 2026"}),l("p",{children:"Use this table as the master list for 2026. Nyepi follows the Saka lunar calendar. Galungan, Kuningan, Saraswati, and Pagerwesi follow the Pawukon cycle, which is why Saraswati and Pagerwesi each appear twice in the same Gregorian year."}),l("div",{className:"my-6 overflow-x-auto border border-[var(--line)] font-ui",children:a("table",{className:"w-full min-w-[560px] border-collapse text-left",children:[l("thead",{children:a("tr",{className:"bg-[var(--text)] text-[var(--surface)]",children:[l("th",{className:"px-4 py-3 text-[13px] font-bold uppercase tracking-wide",children:"Date"}),l("th",{className:"px-4 py-3 text-[13px] font-bold uppercase tracking-wide",children:"Day"}),l("th",{className:"px-4 py-3 text-[13px] font-bold uppercase tracking-wide",children:"Event"})]})}),l("tbody",{children:z1.map(([n,t,r],u)=>a("tr",{className:u%2?"bg-[var(--surface-muted)]":"bg-[var(--surface)]",children:[l("td",{className:"border-t border-[var(--line)] px-4 py-3 font-bold whitespace-nowrap",children:n}),l("td",{className:"border-t border-[var(--line)] px-4 py-3",children:t}),l("td",{className:"border-t border-[var(--line)] px-4 py-3",children:r})]},n+r))})]})}),l("p",{className:"font-ui !text-[0.9rem] text-[var(--text-muted)]",children:"The cycle does not stop at the end of December. The next Galungan falls on 13 January 2027, and the next Kuningan follows on 23 January 2027."}),l("h2",{id:"nyepi",children:"Nyepi 2026: Day of Silence"}),l("p",{children:"Nyepi is the Balinese Hindu New Year and the quietest day of the year in Bali. In 2026 it falls on Thursday 19 March, marking the start of Saka 1948. The evening before, on Wednesday 18 March, villages hold the Ogoh-Ogoh parade, when large demon effigies are carried through the streets before being burned — a loud, crowded, and colourful contrast to the silence that follows."}),l("p",{children:"The silence itself lasts 24 hours, from 6am on Thursday 19 March to 6am on Friday 20 March. During that time there is no travel, no lights, no work, and no outdoor activity. The airport is closed, roads are empty, and even the usual movement of daily life stops. The observance is a day of stillness, fasting, meditation, and reflection, observed by Balinese Hindus and respected by everyone on the island."}),l("p",{children:"For visitors, the rule is simple: stay in your hotel or villa. Plan ahead for food, water, and anything else you will need, because shops and restaurants are closed and you cannot go out to find them. Keep lights low, keep noise down, and stay off the street and beach. The cuti bersama days on Wednesday 18 March and Friday 20 March extend the break around Nyepi, so allow extra time for travel before and after the silence, and expect transport and accommodation around this period to be booked early."}),a("aside",{className:"my-6 border-l-4 border-[var(--primary)] bg-[var(--primary-soft)] px-5 py-4 font-ui text-[0.95rem] leading-relaxed",children:[l("strong",{children:"Before you book:"})," Nyepi is not a day to arrive or depart. Do not plan a flight, ferry, or road journey on 19 March, and check with your hotel about its Nyepi rules, meals, and check-in times before you travel."]}),l("h2",{id:"galungan-kuningan",children:"Galungan and Kuningan 2026"}),l("p",{children:"Galungan celebrates the victory of dharma over adharma — goodness over evil. In 2026 it falls on Wednesday 17 June. In the days before Galungan, bamboo poles called penjor, decorated with coconut leaves, fruit, and cloth, appear along roads and outside homes and temples. On the day itself, families dress in ceremonial clothes, make offerings, and visit temples to pray and give thanks."}),l("p",{children:"Kuningan falls ten days later, on Saturday 27 June, and closes the Galungan period. It is the day when ancestors and deities are honoured as they return, with offerings of yellow rice and flowers, and temple visits that are often quieter and more intimate than Galungan itself. The ten days between the two festivals are a period of prayer, family visits, and ceremony, and many Balinese people travel home to their family temples during this time."}),l("p",{children:"For visitors, Galungan and Kuningan are among the most beautiful times to be in Bali. Penjor line the streets, temples are decorated, and ceremonies are everywhere. It is also a busy time: accommodation fills, some businesses close for ceremonies, and roads around major temples can be slow. Watch respectfully from outside a ceremony unless you are invited in, dress modestly, and follow the guidance of your guide or host."}),l("h2",{id:"saraswati-pagerwesi",children:"Saraswati and Pagerwesi 2026"}),l("p",{children:"Saraswati honours Saraswati, the goddess of knowledge, learning, and the arts. In 2026 it falls on Saturday 4 April and again on Saturday 31 October. On Saraswati, books, manuscripts, and learning tools are blessed and put aside. There is no reading or writing for the day, and schools hold ceremonies in place of ordinary lessons. For students, teachers, and anyone who works with books, music, or art, it is a day to pause and give thanks for knowledge."}),l("p",{children:"Pagerwesi follows four days later — on Wednesday 8 April and again on Wednesday 4 November 2026 — and honours spiritual strength. The name suggests an iron fence: a strong inner barrier against negative influences. Families and temples hold ceremonies asking for strength, protection, and steadiness in spiritual life. Because the two days come as a pair, schools and temples often plan them together, with Saraswati focused on learning and Pagerwesi focused on the discipline and resilience that protect it."}),l("p",{children:"If you are visiting a temple on Saraswati or Pagerwesi, expect ceremonies rather than ordinary sightseeing. School groups, families, and temple communities will be present, and some sites may restrict access during prayers. The practical point for families is the calendar effect: because both days repeat every 210 days, a school year in Bali can include two Saraswati days and two Pagerwesi days, while a Gregorian year with a different alignment would include only one of each."}),l("h2",{id:"tumpek",children:"Other Pawukon Days in 2026"}),l("p",{children:"Beyond Galungan, Kuningan, Saraswati, and Pagerwesi, the Pawukon calendar also sets the Tumpek days — a series of holy days that recur every 35 days, each one blessing a different part of life. Tumpek Landep blesses metal objects, tools, and vehicles. Tumpek Kandang blesses animals and livestock. Tumpek Wayang blesses the performing arts, especially shadow puppetry. Tumpek Krulut blesses music and sound. Tumpek Uduh blesses plants and trees. Tumpek Kuningan, which should not be confused with the Kuningan festival itself, blesses ritual objects and the tools used in ceremony."}),l("p",{children:"Each Tumpek day follows the same logic as the rest of the Pawukon system: it repeats on a fixed cycle, so its Gregorian date shifts from year to year. In practice, that means the exact 2026 date for each Tumpek day is best checked in a printed kalender Bali or a trusted Balinese calendar for the month you are planning. Local temples and villages may also observe a Tumpek day with particular ceremonies that reflect what is being blessed — a blessing of vehicles on Tumpek Landep, for example, looks very different from a blessing of plants on Tumpek Uduh."}),l("p",{children:"Together, the Tumpek days show how the Pawukon calendar works as a calendar of care: it does not only mark the great festivals, but also returns, again and again, to the tools, animals, plants, arts, and sounds that sustain daily life."}),l("h2",{id:"saka",children:"Saka Calendar 2026"}),l("p",{children:"The Saka calendar is a lunar calendar. Saka 1947 closes with Nyepi on 19 March 2026, and Saka 1948 begins on that same day. Saka months — including Kadasa and the other lunar months of the year — follow the phases of the moon, so their start dates move against the Gregorian calendar each year. That movement is why Nyepi, which always marks the Saka New Year, can fall in March in one year and in April in another."}),l("p",{children:"Two moon phases shape the rhythm of Saka life in Bali: Purnama, the full moon, and Tilem, the new moon. Both are marked with ceremonies at temples and family shrines, and both are reasons for Balinese Hindus to pause, pray, and make offerings. Purnama is often the more visible of the two for visitors, with temples busy and ceremonies spilling into the evening. Tilem is quieter, but it is equally important in the Saka calendar, closing one lunar month and opening the next."}),l("p",{children:"For planning, the Saka calendar matters most at its turning points: Nyepi in March, and the Purnama and Tilem ceremonies that fall through the year. If you are planning a ceremony, a temple visit, or a trip that depends on a quiet or busy Bali, check the Saka dates for that month alongside the Pawukon dates, rather than relying on the Gregorian calendar alone."}),l("h2",{id:"balinese-vs-national",children:"Balinese Calendar vs National Calendar"}),l("p",{children:"Bali follows the national calendar, and then adds its own holy days on top of it. Nyepi is a national holiday, so it closes schools, offices, and services across Indonesia, even though its deepest observance is in Bali. Galungan and Kuningan are Bali provincial holidays: they are public holidays in Bali, but not national holidays across Indonesia. Saraswati and Pagerwesi are school and temple days in Bali — schools hold ceremonies, and temples are busy — but they are not general public holidays in the same way."}),l("p",{children:"That layered system is why a Bali calendar looks fuller than the national list. The national holidays from Article #2 also apply in Bali: New Year, Isra Mi'raj, Chinese New Year, Eid al-Fitr, Good Friday, Easter, Labour Day, Ascension Day, Eid al-Adha, Vesak, Pancasila Day, Islamic New Year, Independence Day, Prophet Muhammad's Birthday, and Christmas. On top of those, Bali adds Nyepi as a national holiday, Galungan and Kuningan as provincial holidays, and Saraswati, Pagerwesi, and the Tumpek days as religious and school observances."}),a("div",{className:"my-6 grid gap-3 font-ui sm:grid-cols-2",children:[a("button",{onClick:()=>e(2),className:"group border border-[var(--line)] bg-[var(--surface)] p-4 text-left transition hover:border-[var(--primary)] hover:bg-[var(--primary-soft)]",children:[l("span",{className:"text-[12px] font-bold uppercase tracking-[0.16em] text-[var(--primary)]",children:"Article #2"}),a("span",{className:"mt-2 block text-[17px] font-bold leading-snug",children:["Indonesia public holiday calendar 2026 ",l("span",{"aria-hidden":"true",children:"→"})]}),l("span",{className:"mt-1 block text-[14px] leading-relaxed text-[var(--text-muted)]",children:"The full list of 17 national holidays and 8 cuti bersama days."})]}),a("button",{onClick:()=>e(5),className:"group border border-[var(--line)] bg-[var(--surface)] p-4 text-left transition hover:border-[var(--primary)] hover:bg-[var(--primary-soft)]",children:[l("span",{className:"text-[12px] font-bold uppercase tracking-[0.16em] text-[var(--primary)]",children:"Article #5"}),a("span",{className:"mt-2 block text-[17px] font-bold leading-snug",children:["school calendar 2026 ",l("span",{"aria-hidden":"true",children:"→"})]}),l("span",{className:"mt-1 block text-[14px] leading-relaxed text-[var(--text-muted)]",children:"How school terms, exams, and breaks fit around the national dates."})]})]}),l("p",{children:"If you live in
