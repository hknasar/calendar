sekolah cuti untuk Saraswati dan Pagerwesi.","Muat turun atau lihat kalendar rasmi Sinar Mas Land 2026 dan semak hari bertuah dan tidak bertuah Cina.","Senarai perlumbaan penuh, tarikh GP Indonesia di Mandalika, dan bila menonton / menempah perjalanan.","Tarikh Lebaran yang tepat, berapa hari cuti, bila mudik bermula, bila Ramadan berakhir.","Tarikh mula dan tamat Ramadan yang tepat, imsakiyah harian, tarawih, Laylatul Qadr, dan cuti sekolah / kerja."],jv:["Goleki kalender 2026 sing pas kanthi cepet — preian, sekolah, Islam, Jawa, Bali, akademik, lan acara. Klik artikel ing ngisor kanggo mbukak artikel kuwi wae.","Wong-wong pengin kalender 2026 sing bisa dipercaya kanggo mriksa akhir pekan dawa, preian sekolah, tanggal Ramadan lan Lebaran, lan wektu paling apik kanggo njupuk cuti.","Tanggal endi sing preian nasional, endi sing cuti bersama, lan akhir pekan dawa endi sing bisa dijupuk.","Kapan Ramadan diwiwiti, kapan Lebaran, kapan poso, lan kapan preian dawa tiba.","Goleki weton, priksa dina apik kanggo rabi, pindahan, usaha utawa selamatan, lan ngerti kapan 1 Suro, Mulud, Ruwah, Poso, lan Sawal tiba.","Kapan sekolah diwiwiti, kapan ujian, kapan rapor metu, lan kapan preian dawa.","Kapan Bali sepi nalika Nyepi, kapan pura ngrayakake Galungan lan Kuningan, kapan sekolah preian kanggo Saraswati lan Pagerwesi.","Undhuh utawa deleng kalender resmi Sinar Mas Land 2026 lan priksa dina apik lan ala miturut Tionghoa.","Dhaptar balapan jangkep, tanggal GP Indonesia ing Mandalika, lan kapan nonton / pesen perjalanan.","Tanggal Lebaran sing pas, pira dina preian, kapan mudik diwiwiti, kapan Ramadan rampung.","Tanggal wiwit lan rampunge Ramadan sing pas, imsakiyah saben dina, tarawih, Laylatul Qadr, lan preian sekolah / kerja."],su:["Téangan kalénder 2026 anu pas gancang — libur, sakola, Islam, Jawa, Bali, akademik, jeung acara. Klik artikel di handap pikeun muka éta artikel wungkul.","Seueur jalmi hoyong kalénder 2026 anu tiasa dipercaya pikeun mariksa libur panjang, libur sakola, tanggal Ramadan jeung Idul Fitri, sarta waktos pangsaéna nyandak cuti.","Tanggal mana libur nasional, mana cuti bersama, jeung libur panjang mana anu tiasa dicandak.","Iraha Ramadan dimimitian, iraha Idul Fitri, iraha puasa, jeung iraha libur panjang ragrag.","Téangan weton, pariksa dinten saé pikeun nikah, pindah, usaha atawa selamatan, sarta terang iraha 1 Suro, Mulud, Ruwah, Poso, jeung Sawal ragrag.","Iraha sakola dimimitian, iraha ujian, iraha rapor kaluar, jeung iraha libur panjang.","Iraha Bali jempling nalika Nyepi, iraha pura ngarayakeun Galungan jeung Kuningan, iraha sakola libur pikeun Saraswati jeung Pagerwesi.","Unduh atawa tingali kalénder resmi Sinar Mas Land 2026 sarta pariksa dinten untung jeung teu untung Tionghoa.","Daptar balapan lengkep, tanggal GP Indonesia di Mandalika, jeung iraha nonton / mesen perjalanan.","Tanggal Lebaran anu pas, sabaraha dinten libur, iraha mudik dimimitian, iraha Ramadan réngsé.","Tanggal mimiti jeung réngséna Ramadan anu pas, imsakiyah unggal dinten, tarawih, Laylatul Qadr, jeung libur sakola / damel."],ban:["Rereh kalender 2026 sane pas gelis — preian, sekolah, Islam, Jawa, Bali, akademik, lan acara. Klik artikel ring sor mangda mukak artikel punika kemanten.","Akeh jadma ngarsayang kalender 2026 sane prasida kaandelang anggen mriksa akhir pekan lantang, preian sekolah, tanggal Ramadan lan Lebaran, lan galah pinih becik ngambil cuti.","Tanggal napi preian nasional, napi cuti bersama, lan akhir pekan lantang napi sane prasida kaambil.","Kapan Ramadan kakawitin, kapan Lebaran, kapan mapuasa, lan kapan preian lantang rauh.","Rereh weton, cek rahina becik anggen pawiwahan, pindahan, usaha utawi selamatan, lan uning kapan 1 Suro, Mulud, Ruwah, Poso, lan Sawal rauh.","Kapan sekolah kakawitin, kapan ujian, kapan rapor medal, lan kapan preian lantang.","Kapan Bali sepi rikala Nyepi, kapan pura ngrayahang Galungan lan Kuningan, kapan sekolah preian antuk Saraswati lan Pagerwesi.","Undhuh utawi cingak kalender resmi Sinar Mas Land 2026 lan cek rahina becik lan kaon manut Tionghoa.","Daftar balapan jangkep, tanggal GP Indonesia ring Mandalika, lan kapan menonton / mesen perjalanan.","Tanggal Lebaran sane pas, pidan rahina preian, kapan mudik kakawitin, kapan Ramadan puput.","Tanggal ngawitin lan puput Ramadan sane pas, imsakiyah saben rahina, tarawih, Laylatul Qadr, lan preian sekolah / pakaryan."],hi:["सही 2026 कैलेंडर जल्दी खोजें — छुट्टियाँ, स्कूल, इस्लामी, जावानी, बाली, अकादमिक और आयोजन। केवल वह लेख खोलने के लिए नीचे किसी लेख पर क्लिक करें।","अधिकांश लोग लंबी छुट्टियों, स्कूल की छुट्टियों, रमज़ान और ईद की तिथियों और छुट्टी लेने के सबसे अच्छे समय की जाँच के लिए एक भरोसेमंद 2026 कैलेंडर चाहते हैं।","कौन-सी तिथियाँ राष्ट्रीय छुट्टी हैं, कौन-सी सामूहिक छुट्टी हैं, और कौन-से लंबे सप्ताहांत लिए जा सकते हैं।","रमज़ान कब शुरू होता है, ईद कब है, कब रोज़ा रखना है, और लंबी छुट्टियाँ कब पड़ती हैं।","वेटोन खोजें, शादी, घर बदलने, व्यवसाय या सलामतन के लिए शुभ दिन देखें, और जानें कि 1 सूरो, मुलुद, रुवाह, पोसो और सावल कब पड़ते हैं।","स्कूल कब शुरू होता है, परीक्षाएँ कब हैं, रिपोर्ट कार्ड कब आते हैं, और लंबी छुट्टियाँ कब हैं।","न्येपी के लिए बाली कब शांत रहता है, मंदिर गलुंगन और कुनिंगन कब मनाते हैं, सरस्वती और पागेरवेसी के लिए स्कूल कब बंद रहते हैं।","आधिकारिक सिनार मास लैंड 2026 कैलेंडर डाउनलोड या देखें और चीनी शुभ और अशुभ दिन देखें।","पूरी रेस सूची, मंडलिका में इंडोनेशियाई जीपी की तिथि, और कब देखना / यात्रा बुक करना है।","लेबरन की सटीक तिथि, कितने दिन छुट्टी, मुदिक कब शुरू होता है, रमज़ान कब समाप्त होता है।","रमज़ान के शुरू और समाप्त होने की सटीक तिथि, दैनिक इम्साकिया, तरावीह, लैलतुल क़द्र, और स्कूल / काम की छुट्टियाँ।"],ar:["اعثر بسرعة على تقويم 2026 المناسب — العطل، المدرسة، الإسلامي، الجاوي، البالي، الأكاديمي والفعاليات. انقر على أي مقالة أدناه لفتح تلك المقالة فقط.","يريد معظم الناس تقويم 2026 موثوقًا للتحقق من عطلات نهاية الأسبوع الطويلة، والعطل المدرسية، ومواعيد رمضان والعيد، وأفضل وقت لأخذ إجازة.","أي التواريخ عطل وطنية، وأيها إجازة جماعية، وأي عطلات نهاية أسبوع طويلة يمكن أخذها.","متى يبدأ رمضان، ومتى العيد، ومتى الصيام، ومتى تقع العطل الطويلة.","اعثر على ويتون، وتحقق من يوم مناسب للزواج أو الانتقال أو العمل أو سيلاماتان، واعرف متى يقع 1 سورو ومولود ورواه وبوسو وساوال.","متى تبدأ المدرسة، ومتى الامتحانات، ومتى تصدر التقارير، ومتى العطل الطويلة.","متى تكون بالي هادئة في نييبي، ومتى تحتفل المعابد بغالونغان وكونينغان، ومتى تغلق المدارس لساراسواتي وباغيرويسي.","حمّل أو اعرض تقويم سينار ماس لاند 2026 الرسمي وتحقق من الأيام الصينية المحظوظة وغير المحظوظة.","قائمة السباقات الكاملة، وموعد سباق إندونيسيا الكبير في مانداليكا، ومتى تشاهد / تحجز السفر.","موعد لبران الدقيق، وعدد أيام العطلة، ومتى يبدأ موديك، ومتى ينتهي رمضان.","الموعد الدقيق لبداية رمضان ونهايته، والإمساكية اليومية، والتراويح، وليلة القدر، وعطل المدرسة / العمل."],"zh-CN":["快速找到合适的 2026 日历——假期、学校、伊斯兰历、爪哇历、巴厘历、学术和活动。点击下方任意文章，只打开那篇文章。","大多数人想要一份可靠的 2026 日历，用来查看长周末、学校假期、斋月和开斋节日期，以及请假的最佳时间。","哪些日期是法定假日，哪些是集体休假，哪些长周末可以休。","斋月何时开始，开斋节是何时，何时斋戒，长假落在何时。","查找 weton，查看结婚、搬家、开业或 selamatan 的吉日，并了解 1 Suro、Mulud、Ruwah、Poso 和 Sawal 是何时。","学校何时开学，考试何时，成绩单何时发放，长假何时。","巴厘岛在 Nyepi 时何时安静，寺庙何时庆祝 Galungan 和 Kuningan，学校何时因 Saraswati 和 Pagerwesi 放假。","下载或查看官方 Sinar Mas Land 2026 日历，并查看中国黄道吉日和忌日。","完整比赛列表、曼达利卡印尼大奖赛日期，以及何时观看 / 预订旅行。","准确的 Lebaran 日期、放假几天、mudik 何时开始、斋月何时结束。","斋月准确的开始和结束日期、每日 imsakiyah、tarawih、Laylatul Qadr，以及学校 / 工作假期。"],"zh-TW":["快速找到合適的 2026 行事曆——假期、學校、伊斯蘭曆、爪哇曆、峇里曆、學術和活動。點選下方任一篇文章，只開啟那篇文章。","大多數人想要一份可靠的 2026 行事曆，用來查看長週末、學校假期、齋月和開齋節日期，以及請假的最佳時間。","哪些日期是國定假日，哪些是集體休假，哪些長週末可以休。","齋月何時開始，開齋節是何時，何時齋戒，長假落在何時。","查找 weton，查看結婚、搬家、開業或 selamatan 的吉日，並了解 1 Suro、Mulud、Ruwah、Poso 和 Sawal 是何時。","學校何時開學，考試何時，成績單何時發放，長假何時。","峇里島在 Nyepi 時何時安靜，寺廟何時慶祝 Galungan 和 Kuningan，學校何時因 Saraswati 和 Pagerwesi 放假。","下載或查看官方 Sinar Mas Land 2026 行事曆，並查看中國黃道吉日和忌日。","完整比賽列表、曼達利卡印尼大獎賽日期，以及何時觀看 / 預訂旅行。","準確的 Lebaran 日期、放假幾天、mudik 何時開始、齋月何時結束。","齋月準確的開始和結束日期、每日 imsakiyah、tarawih、Laylatul Qadr，以及學校 / 工作假期。"],ja:["ぴったりの2026年カレンダーを素早く見つけましょう——休日、学校、イスラム、ジャワ、バリ、学術、イベント。下の記事をクリックすると、その記事だけが開きます。","多くの人が、連休、学校の休み、ラマダンとイードの日付、休暇を取る最適な時期を確認できる、信頼できる2026年カレンダーを求めています。","どの日が国民の祝日で、どれが共同休暇で、どの連休が取れるか。","ラマダンはいつ始まり、イードはいつで、いつ断食し、長期休暇はいつか。","ウェトンを調べ、結婚・引っ越し・事業・セラマタンの吉日を確認し、1スロ、ムルド、ルワ、ポソ、サワルがいつかを知る。","学校はいつ始まり、試験はいつで、通知表はいつ出て、長期休暇はいつか。","ニェピでバリが静かになるのはいつか、寺院がガルンガンとクニンガンを祝うのはいつか、サラスワティとパゲルウェシで学校が休みになるのはいつか。","公式シナルマスランド2026年カレンダーをダウンロード／表示し、中国の吉日・凶日を確認する。","全レース一覧、マンダリカのインドネシアGPの日程、いつ観戦／旅行を予約するか。","レバランの正確な日付、何日休みか、ムディックはいつ始まり、ラマダンはいつ終わるか。","ラマダンの正確な開始と終了、毎日のイームサキヤ、タラウィー、ライラトゥル・カドル、学校／仕事の休み。"],es:["Encuentra rápido el calendario 2026 adecuado: festivos, escuela, islámico, javanés, balinés, académico y eventos. Haz clic en un artículo para abrir solo ese artículo.","La mayoría quiere un calendario 2026 fiable para consultar fines de semana largos, vacaciones escolares, fechas de Ramadán y Eid, y el mejor momento para pedir vacaciones.","Qué fechas son festivos nacionales, cuáles son vacaciones colectivas y qué fines de semana largos se pueden tomar.","Cuándo empieza Ramadán, cuándo es Eid, cuándo ayunar y cuándo caen las vacaciones largas.","Busca tu weton, consulta un buen día para boda, mudanza, negocio o selamatan, y descubre cuándo caen 1 Suro, Mulud, Ruwah, Poso y Sawal.","Cuándo empieza la escuela, cuándo son los exámenes, cuándo salen las notas y cuándo son las vacaciones largas.","Cuándo Bali guarda silencio por Nyepi, cuándo los templos celebran Galungan y Kuningan, cuándo las escuelas cierran por Saraswati y Pagerwesi.","Descarga o consulta el calendario oficial Sinar Mas Land 2026 y revisa los días chinos de suerte y de mala suerte.","Lista completa de carreras, fecha del GP de Indonesia en Mandalika y cuándo ver / reservar el viaje.","Fecha exacta de Lebaran, cuántos días libres, cuándo empieza el mudik y cuándo termina Ramadán.","Fecha exacta de inicio y fin de Ramadán, imsakiyah diario, tarawih, Laylatul Qadr y vacaciones escolares / laborales."],fr:["Trouvez vite le calendrier 2026 qu’il vous faut — vacances, école, islamique, javanais, balinais, universitaire et événements. Cliquez sur un article ci-dessous pour n’ouvrir que cet article.","La plupart des gens veulent un calendrier 2026 fiable pour vérifier les longs week-ends, les vacances scolaires, les dates du ramadan et de l’Aïd, et le meilleur moment pour prendre congé.","Quelles dates sont des jours fériés, lesquelles sont des congés collectifs, et quels longs week-ends peuvent être pris.","Quand commence le ramadan, quand est l’Aïd, quand jeûner, et quand tombent les longues vacances.","Trouvez votre weton, vérifiez un bon jour pour un mariage, un déménagement, une affaire ou un selamatan, et sachez quand tombent 1 Suro, Mulud, Ruwah, Poso et Sawal.","Quand l’école commence, quand sont les examens, quand sortent les bulletins, et quand sont les longues vacances.","Quand Bali est silencieuse pour Nyepi, quand les temples célèbrent Galungan et Kuningan, quand les écoles ferment pour Saraswati et Pagerwesi.","Téléchargez ou consultez le calendrier officiel Sinar Mas Land 2026 et vérifiez les jours chinois fastes et néfastes.","Liste complète des courses, date du GP d’Indonésie à Mandalika, et quand regarder / réserver le voyage.","Date exacte de Lebaran, nombre de jours de congé, début du mudik, fin du ramadan.","Dates exactes de début et de fin du ramadan, imsakiyah quotidien, tarawih, Laylatul Qadr, et vacances scolaires / professionnelles."],de:["Finde schnell den passenden Kalender 2026 — Feiertage, Schule, Islamisch, Javanisch, Balinesisch, Akademisch und Veranstaltungen. Klicke unten auf einen Artikel, um nur diesen Artikel zu öffnen.","Die meisten wollen einen verlässlichen Kalender 2026, um lange Wochenenden, Schulferien, Ramadan- und Eid-Termine und die beste Zeit für Urlaub zu prüfen.","Welche Termine nationale Feiertage sind, welche gemeinsame Urlaubstage, und welche langen Wochenenden genommen werden können.","Wann Ramadan beginnt, wann Eid ist, wann gefastet wird und wann lange Ferien fallen.","Finde dein Weton, prüfe einen guten Tag für Hochzeit, Umzug, Geschäft oder Selamatan und erfahre, wann 1 Suro, Mulud, Ruwah, Poso und Sawal fallen.","Wann die Schule beginnt, wann Prüfungen sind, wann Zeugnisse kommen und wann lange Ferien sind.","Wann Bali zu Nyepi still ist, wann Tempel Galungan und Kuningan feiern, wann Schulen zu Saraswati und Pagerwesi schließen.","Lade den offiziellen Sinar Mas Land Kalender 2026 herunter oder sieh ihn an und prüfe chinesische Glücks- und Unglückstage.","Vollständige Rennliste, Datum des Indonesien-GP in Mandalika und wann man zuschaut / Reisen bucht.","Genaues Lebaran-Datum, wie viele freie Tage, wann Mudik beginnt, wann Ramadan endet.","Genaues Start- und Enddatum von Ramadan, tägliche Imsakiyah, Tarawih, Laylatul Qadr und Schul- / Arbeitsferien."],th:["ค้นหาปฏิทิน 2026 ที่ใช่ได้อย่างรวดเร็ว — วันหยุด โรงเรียน อิสลาม ชวา บาหลี วิชาการ และกิจกรรม คลิกบทความด้านล่างเพื่อเปิดเฉพาะบทความนั้น","คนส่วนใหญ่ต้องการปฏิทิน 2026 ที่เชื่อถือได้ เพื่อเช็กวันหยุดยาว วันหยุดโรงเรียน วันรอมฎอนและวันอีด และเวลาที่ดีที่สุดในการลาพัก","วันไหนเป็นวันหยุดแห่งชาติ วันไหนเป็นวันหยุดร่วม และวันหยุดยาวใดที่ลาได้","รอมฎอนเริ่มเมื่อไหร่ วันอีดคือเมื่อไหร่ อดอาหารเมื่อไหร่ และวันหยุดยาวตรงกับเมื่อไหร่","หา weton เช็กวันดีสำหรับแต่งงาน ย้ายบ้าน ธุรกิจ หรือ selamatan และรู้ว่า 1 Suro, Mulud, Ruwah, Poso และ Sawal ตรงกับเมื่อไหร่","โรงเรียนเปิดเมื่อไหร่ สอบเมื่อไหร่ ใบรายงานออกเมื่อไหร่ และวันหยุดยาวเมื่อไหร่","บาหลีเงียบในวัน Nyepi เมื่อไหร่ วัดฉลอง Galungan และ Kuningan เมื่อไหร่ โรงเรียนปิดวัน Saraswati และ Pagerwesi เมื่อไหร่","ดาวน์โหลดหรือดูปฏิทินทางการ Sinar Mas Land 2026 และเช็กวันมงคลและวันอัปมงคลของจีน","รายชื่อการแข่งขันทั้งหมด วันแข่งขันอินโดนีเซีย GP ที่มันดาลิกา และเมื่อไหร่ควรดู / จองการเดินทาง","วันที่ Lebaran ที่แน่ชัด หยุดกี่วัน mudik เริ่มเมื่อไหร่ รอมฎอนจบเมื่อไหร่","วันเริ่มและวันจบของรอมฎอนที่แน่ชัด ตาราง imsakiyah รายวัน tarawih Laylatul Qadr และวันหยุดโรงเรียน / งาน"],vi:["Tìm nhanh lịch 2026 phù hợp — ngày lễ, trường học, Hồi giáo, Java, Bali, học thuật và sự kiện. Nhấn vào một bài viết bên dưới để chỉ mở bài viết đó.","Hầu hết mọi người muốn một lịch 2026 đáng tin cậy để kiểm tra cuối tuần dài, kỳ nghỉ học, ngày Ramadan và Eid, và thời điểm tốt nhất để nghỉ phép.","Ngày nào là ngày lễ quốc gia, ngày nào là nghỉ chung, và cuối tuần dài nào có thể nghỉ.","Ramadan bắt đầu khi nào, Eid khi nào, khi nào ăn chay, và kỳ nghỉ dài rơi vào khi nào.","Tìm weton, kiểm tra ngày tốt cho đám cưới, chuyển nhà, kinh doanh hoặc selamatan, và biết 1 Suro, Mulud, Ruwah, Poso và Sawal rơi vào khi nào.","Trường học bắt đầu khi nào, thi khi nào, bảng điểm ra khi nào, và kỳ nghỉ dài khi nào.","Bali yên tĩnh vào Nyepi khi nào, đền thờ mừng Galungan và Kuningan khi nào, trường học đóng cửa vào Saraswati và Pagerwesi khi nào.","Tải xuống hoặc xem lịch chính thức Sinar Mas Land 2026 và kiểm tra ngày tốt và xấu của Trung Quốc.","Danh sách đua đầy đủ, ngày GP Indonesia tại Mandalika, và khi nào xem / đặt chuyến đi.","Ngày Lebaran chính xác, nghỉ bao nhiêu ngày, mudik bắt đầu khi nào, Ramadan kết thúc khi nào.","Ngày bắt đầu và kết thúc Ramadan chính xác, imsakiyah hàng ngày, tarawih, Laylatul Qadr, và kỳ nghỉ học / làm việc."],fil:["Hanapin agad ang tamang kalendaryo 2026 — mga holiday, paaralan, Islamic, Javanese, Balinese, akademiko at mga event. I-click ang anumang artikulo sa ibaba para buksan lang ang artikulong iyon.","Gusto ng karamihan ng maaasahang kalendaryo 2026 para tingnan ang long weekends, school breaks, mga petsa ng Ramadan at Eid, at pinakamagandang oras mag-leave.","Aling mga petsa ang pambansang holiday, alin ang cuti bersama, at aling long weekends ang puwedeng kunin.","Kailan magsisimula ang Ramadan, kailan ang Eid, kailan mag-aayuno, at kailan papatak ang mahahabang bakasyon.","Hanapin ang weton, tingnan ang magandang araw para sa kasal, paglipat, negosyo o selamatan, at alamin kung kailan ang 1 Suro, Mulud, Ruwah, Poso at Sawal.","Kailan magsisimula ang klase, kailan ang exam, kailan lalabas ang report card, at kailan ang mahahabang bakasyon.","Kailan tahimik ang Bali para sa Nyepi, kailan nagdiriwang ang mga templo ng Galungan at Kuningan, kailan sarado ang mga paaralan para sa Saraswati at Pagerwesi.","I-download o tingnan ang opisyal na Sinar Mas Land 2026 calendar at tingnan ang Chinese lucky at unlucky days.","Buong listahan ng karera, petsa ng Indonesian GP sa Mandalika, at kailan manonood / magbu-book ng biyahe.","Eksaktong petsa ng Lebaran, ilang araw ang bakasyon, kailan magsisimula ang mudik, kailan matatapos ang Ramadan.","Eksaktong simula at pagtatapos ng Ramadan, araw-araw na imsakiyah, tarawih, Laylatul Qadr, at school / work holidays."],pt:["Encontre rápido o calendário 2026 certo — feriados, escola, islâmico, javanês, balinês, acadêmico e eventos. Clique em um artigo abaixo para abrir apenas esse artigo.","A maioria quer um calendário 2026 confiável para verificar fins de semana prolongados, férias escolares, datas do Ramadã e do Eid e o melhor momento para tirar folga.","Quais datas são feriados nacionais, quais são folgas coletivas e quais fins de semana prolongados podem ser aproveitados.","Quando o Ramadã começa, quando é o Eid, quando jejuar e quando caem as férias longas.","Encontre seu weton, verifique um bom dia para casamento, mudança, negócio ou selamatan e saiba quando caem 1 Suro, Mulud, Ruwah, Poso e Sawal.","Quando a escola começa, quando são as provas, quando saem os boletins e quando são as férias longas.","Quando Bali fica em silêncio para o Nyepi, quando os templos celebram Galungan e Kuningan, quando as escolas fecham para Saraswati e Pagerwesi.","Baixe ou veja o calendário oficial Sinar Mas Land 2026 e verifique os dias chineses de sorte e azar.","Lista completa de corridas, data do GP da Indonésia em Mandalika e quando assistir / reservar a viagem.","Data exata do Lebaran, quantos dias de folga, quando começa o mudik e quando termina o Ramadã.","Data exata de início e fim do Ramadã, imsakiyah diário, tarawih, Laylatul Qadr e férias escolares / de trabalho."],it:["Trova subito il calendario 2026 giusto — festività, scuola, islamico, giavanese, balinese, accademico ed eventi. Clicca su un articolo qui sotto per aprire solo quell’articolo.","La maggior parte delle persone vuole un calendario 2026 affidabile per controllare i ponti, le vacanze scolastiche, le date di Ramadan ed Eid e il momento migliore per prendere ferie.","Quali date sono festività nazionali, quali sono ferie collettive e quali ponti si possono prendere.","Quando inizia il Ramadan, quando è l’Eid, quando digiunare e quando cadono le lunghe vacanze.","Trova il tuo weton, controlla un buon giorno per matrimonio, trasloco, attività o selamatan e scopri quando cadono 1 Suro, Mulud, Ruwah, Poso e Sawal.","Quando inizia la scuola, quando sono gli esami, quando escono le pagelle e quando sono le lunghe vacanze.","Quando Bali è silenziosa per Nyepi, quando i templi celebrano Galungan e Kuningan, quando le scuole chiudono per Saraswati e Pagerwesi.","Scarica o guarda il calendario ufficiale Sinar Mas Land 2026 e controlla i giorni cinesi fortunati e sfortunati.","Elenco completo delle gare, data del GP d’Indonesia a Mandalika e quando guardare / prenotare il viaggio.","Data esatta di Lebaran, quanti giorni liberi, quando inizia il mudik e quando finisce il Ramadan.","Data esatta di inizio e fine del Ramadan, imsakiyah quotidiano, tarawih, Laylatul Qadr e vacanze scolastiche / lavorative."],nl:["Vind snel de juiste kalender 2026 — feestdagen, school, islamitisch, Javaans, Balinees, academisch en evenementen. Klik hieronder op een artikel om alleen dat artikel te openen.","De meeste mensen willen een betrouwbare kalender 2026 om lange weekenden, schoolvakanties, ramadan- en Eid-data en de beste tijd om verlof te nemen te controleren.","Welke data nationale feestdagen zijn, welke gezamenlijke verlofdagen, en welke lange weekenden genomen kunnen worden.","Wanneer ramadan begint, wanneer Eid is, wanneer te vasten en wanneer lange vakanties vallen.","Zoek je weton, controleer een goede dag voor bruiloft, verhuizing, bedrijf of selamatan, en weet wanneer 1 Suro, Mulud, Ruwah, Poso en Sawal vallen.","Wanneer school begint, wanneer examens zijn, wanneer rapporten komen en wanneer lange vakanties zijn.","Wanneer Bali stil is voor Nyepi, wanneer tempels Galungan en Kuningan vieren, wanneer scholen sluiten voor Saraswati en Pagerwesi.","Download of bekijk de officiële Sinar Mas Land kalender 2026 en controleer Chinese geluks- en ongeluksdagen.","Volledige racelijst, datum van de Indonesische GP in Mandalika, en wanneer te kijken / reizen te boeken.","Exacte Lebaran-datum, hoeveel vrije dagen, wanneer mudik begint, wanneer ramadan eindigt.","Exacte start- en einddatum van ramadan, dagelijkse imsakiyah, tarawih, Laylatul Qadr en school- / werkvakanties."],ru:["Быстро найдите подходящий календарь 2026 — праздники, школа, исламский, яванский, балийский, академический и события. Нажмите на статью ниже, чтобы открыть только её.","Большинству нужен надёжный календарь 2026, чтобы проверить длинные выходные, школьные каникулы, даты Рамадана и Ид, и лучшее время для отпуска.","Какие даты — национальные праздники, какие — коллективные выходные, и какие длинные выходные можно взять.","Когда начинается Рамадан, когда Ид, когда поститься и когда выпадают длинные каникулы.","Найдите свой вeton, проверьте хороший день для свадьбы, переезда, бизнеса или селаматана и узнайте, когда выпадают 1 Суро, Мулуд, Рувах, Посо и Савал.","Когда начинается школа, когда экзамены, когда табели и когда длинные каникулы.","Когда Бали замолкает на Ньепи, когда храмы празднуют Галунган и Кунинган, когда школы закрываются на Сарасвати и Пагервеси.","Скачайте или посмотрите официальный календарь Sinar Mas Land 2026 и проверьте китайские счастливые и несчастливые дни.","Полный список гонок, дата Гран-при Индонезии в Мандалике и когда смотреть / бронировать поездку.","Точная дата Лебарана, сколько выходных, когда начинается мудик, когда заканчивается Рамадан.","Точные даты начала и конца Рамадана, ежедневная имсакия, таравих, Лейлят аль-Кадр и школьные / рабочие каникулы."],tr:["Doğru 2026 takvimini hızlıca bulun — tatiller, okul, İslami, Cava, Bali, akademik ve etkinlikler. Yalnızca o makaleyi açmak için aşağıdaki bir makaleye tıklayın.","Çoğu kişi uzun hafta sonlarını, okul tatillerini, Ramazan ve Bayram tarihlerini ve izin almak için en iyi zamanı kontrol etmek için güvenilir bir 2026 takvimi istiyor.","Hangi tarihler ulusal tatil, hangileri toplu izin ve hangi uzun hafta sonları alınabilir.","Ramazan ne zaman başlıyor, Bayram ne zaman, ne zaman oruç tutuluyor ve uzun tatiller ne zamana denk geliyor.","Weton’unuzu bulun, düğün, taşınma, iş veya selamatan için iyi bir gün kontrol edin ve 1 Suro, Mulud, Ruwah, Poso ve Sawal’ın ne zamana denk geldiğini öğrenin.","Okul ne zaman başlıyor, sınavlar ne zaman, karneler ne zaman çıkıyor ve uzun tatiller ne zaman.","Bali Nyepi için ne zaman sessizleşiyor, tapınaklar Galungan ve Kuningan’ı ne zaman kutluyor, okullar Saraswati ve Pagerwesi için ne zaman kapanıyor.","Resmî Sinar Mas Land 2026 takvimini indirin veya görüntüleyin ve Çin uğurlu ve uğursuz günlerini kontrol edin.","Tam yarış listesi, Mandalika’daki Endonezya GP tarihi ve ne zaman izleneceği / seyahat rezervasyonu yapılacağı.","Kesin Lebaran tarihi, kaç gün izin, mudik ne zaman başlıyor, Ramazan ne zaman bitiyor.","Ramazan’ın kesin başlangıç ve bitiş tarihi, günlük imsakiye, teravih, Kadir Gecesi ve okul / iş tatilleri."],fa:["تقویم ۲۰۲۶ مناسب را سریع پیدا کنید — تعطیلات، مدرسه، اسلامی، جاوه‌ای، بالیایی، دانشگاهی و رویدادها. روی هر مقاله زیر کلیک کنید تا فقط همان مقاله باز شود.","بیشتر مردم تقویم ۲۰۲۶ قابل اعتمادی می‌خواهند تا آخر هفته‌های طولانی، تعطیلات مدرسه، تاریخ‌های رمضان و عید، و بهترین زمان مرخصی را بررسی کنند.","کدام تاریخ‌ها تعطیل ملی‌اند، کدام‌ها مرخصی جمعی‌اند، و کدام آخر هفته‌های طولانی را می‌توان گرفت.","رمضان کی شروع می‌شود، عید کی است، کی روزه بگیریم، و تعطیلات طولانی کی می‌افتند.","وتون خود را پیدا کنید، روز خوبی برای عروسی، جابه‌جایی، کسب‌وکار یا سلاماتان بررسی کنید، و بدانید ۱ سورو، مولود، رواه، پوسو و ساوال کی می‌افتند.","مدرسه کی شروع می‌شود، امتحان‌ها کی‌اند، کارنامه‌ها کی می‌آیند، و تعطیلات طولانی کی‌اند.","بالی در نیه‌پی کی ساکت است، معابد گالونگان و کونینگان را کی جشن می‌گیرند، مدرسه‌ها برای ساراسواتی و پاگِروِسی کی تعطیل‌اند.","تقویم رسمی سینار ماس لند ۲۰۲۶ را دانلود یا مشاهده کنید و روزهای خوش‌یمن و بدیمن چینی را بررسی کنید.","فهرست کامل مسابقات، تاریخ گرندپری اندونزی در ماندالیکا، و کی تماشا / سفر رزرو کنید.","تاریخ دقیق لبران، چند روز تعطیل، مودیک کی شروع می‌شود، رمضان کی تمام می‌شود.","تاریخ دقیق شروع و پایان رمضان، امساکیه روزانه، تراویح، شب قدر، و تعطیلات مدرسه / کاری."],ne:["सही २०२६ क्यालेन्डर छिटो फेला पार्नुहोस् — बिदा, विद्यालय, इस्लामिक, जाभानी, बाली, शैक्षिक र कार्यक्रम। त्यो लेख मात्र खोल्न तलको कुनै लेखमा क्लिक गर्नुहोस्।","धेरैजसो मानिसहरू लामो सप्ताहन्त, विद्यालय बिदा, रमजान र ईद मिति, र बिदा लिन उत्तम समय जाँच्न भरपर्दो २०२६ क्यालेन्डर चाहन्छन्।","कुन मितिहरू राष्ट्रिय बिदा हुन्, कुन सामूहिक बिदा, र कुन लामो सप्ताहन्त लिन सकिन्छ।","रमजान कहिले सुरु हुन्छ, ईद कहिले हो, कहिले उपवास बस्ने, र लामो बिदा कहिले पर्छन्।","आफ्नो वेटोन खोज्नुहोस्, विवाह, सर्ने, व्यवसाय वा सेलामतनका लागि राम्रो दिन जाँच्नुहोस्, र १ सुरो, मुलुद, रुवाह, पोसो र सावल कहिले पर्छन् जान्नुहोस्।","विद्यालय कहिले सुरु हुन्छ, परीक्षा कहिले हुन्छन्, रिपोर्ट कार्ड कहिले आउँछन्, र लामो बिदा कहिले हुन्छन्।","न्येपीका लागि बाली कहिले शान्त हुन्छ, मन्दिरहरूले गालुङ्गान र कुनिङ्गान कहिले मनाउँछन्, सरस्वती र पागेरवेसीका लागि विद्यालय कहिले बन्द हुन्छन्।","आधिकारिक सिनार मास ल्याण्ड २०२६ क्यालेन्डर डाउनलोड वा हेर्नुहोस् र चिनियाँ शुभ र अशुभ दिनहरू जाँच्नुहोस्।","पूर्ण दौड सूची, मण्डलिकामा इन्डोनेसियाली जीपी मिति, र कहिले हेर्ने / यात्रा बुक गर्ने।","लेबरानको ठ्याक्कै मिति, कति दिन बिदा, मुदिक कहिले सुरु हुन्छ, रमजान कहिले सकिन्छ।","रमजानको ठ्याक्कै सुरु र अन्त्य मिति, दैनिक इम्साकिया, तरावीह, लैलतुल कद्र, र विद्यालय / काम बिदा।"],si:["නිවැරදි 2026 දින දර්ශනය ඉක්මනින් සොයන්න — නිවාඩු, පාසල, ඉස්ලාම්, ජාවා, බාලි, අධ්‍යයන සහ සිදුවීම්. එම ලිපිය පමණක් විවෘත කිරීමට පහත ලිපියක් ක්ලික් කරන්න.","බොහෝ දෙනෙකුට දිගු සති අන්ත, පාසල් නිවාඩු, රාමසාන් සහ ඊද් දින, සහ නිවාඩු ගැනීමට හොඳම කාලය පරීක්ෂා කිරීමට විශ්වාසදායක 2026 දින දර්ශනයක් අවශ්‍යය.","කුමන දින ජාතික නිවාඩුද, කුමන දින සාමූහික නිවාඩුද, සහ කුමන දිගු සති අන්ත ගත හැකිද.","රාමසාන් ආරම්භ වන්නේ කවදාද, ඊද් කවදාද, උපවාස කරන්නේ කවදාද, සහ දිගු නිවාඩු වැටෙන්නේ කවදාද.","ඔබේ weton සොයන්න, විවාහය, නිවස මාරු කිරීම, ව්‍යාපාරය හෝ selamatan සඳහා හොඳ දිනයක් පරීක්ෂා කරන්න, සහ 1 Suro, Mulud, Ruwah, Poso සහ Sawal වැටෙන්නේ කවදාදැයි දැනගන්න.","පාසල ආරම්භ වන්නේ කවදාද, විභාග කවදාද, වාර්තා කවදාද, සහ දිගු නිවාඩු කවදාද.","Nyepi සඳහා බාලි නිහඬ වන්නේ කවදාද, දේවාල Galungan සහ Kuningan සමරන්නේ කවදාද, Saraswati සහ Pagerwesi සඳහා පාසල් වසන්නේ කවදාද.","නිල Sinar Mas Land 2026 දින දර්ශනය බාගන්න හෝ බලන්න සහ චීන වාසනාවන්ත සහ අවාසනාවන්ත දින පරීක්ෂා කරන්න.","සම්පූර්ණ තරඟ ලැයිස්තුව, Mandalika හි ඉන්දුනීසියානු GP දිනය, සහ නැරඹීමට / සංචාරය වෙන් කිරීමට කවදාද.","Lebaran හි නිවැරදි දිනය, නිවාඩු දින කීයක්, mudik ආරම්භ වන්නේ කවදාද, රාමසාන් අවසන් වන්නේ කවදාද.","රාමසාන් හි නිවැරදි ආරම්භය සහ අවසානය, දෛනික imsakiyah, tarawih, Laylatul Qadr, සහ පාසල් / රැකියා නිවාඩු."],km:["ស្វែងរកប្រតិទិន 2026 ដែលត្រឹមត្រូវយ៉ាងឆាប់រហ័ស — ថ្ងៃឈប់សម្រាក សាលារៀន អ៊ីស្លាម ជ្វា បាលី សិក្សា និងព្រឹត្តិការណ៍។ ចុចលើអត្ថបទខាងក្រោមដើម្បីបើកតែអត្ថបទនោះ។","មនុស្សភាគច្រើនចង់បានប្រតិទិន 2026 ដែលអាចទុកចិត្តបាន ដើម្បីពិនិត្យចុងសប្តាហ៍វែង ថ្ងៃឈប់សម្រាកសាលារៀន កាលបរិច្ឆេទរ៉ាម៉ាដន និងអ៊ីដ និងពេលវេលាល្អបំផុតដើម្បីឈប់សម្រាក។","កាលបរិច្ឆេទណាជាថ្ងៃឈប់សម្រាកជាតិ ណាជាថ្ងៃឈប់សម្រាករួម និងចុងសប្តាហ៍វែងណាដែលអាចយកបាន។","រ៉ាម៉ាដនចាប់ផ្តើមនៅពេលណា អ៊ីដនៅពេលណា តមអាហារនៅពេលណា និងថ្ងៃឈប់សម្រាកវែងធ្លាក់នៅពេលណា។","ស្វែងរក weton របស់អ្នក ពិនិត្យថ្ងៃល្អសម្រាប់អាពាហ៍ពិពាហ៍ ការផ្លាស់ប្តូរផ្ទះ អាជីវកម្ម ឬ selamatan និងដឹងថា 1 Suro, Mulud, Ruwah, Poso និង Sawal ធ្លាក់នៅពេលណា។","សាលារៀនចាប់ផ្តើមនៅពេលណា ការប្រឡងនៅពេលណា របាយការណ៍ចេញនៅពេលណា និងថ្ងៃឈប់សម្រាកវែងនៅពេលណា។","បាលីស្ងាត់សម្រាប់ Nyepi នៅពេលណា ប្រាសាទប្រារព្ធ Galungan និង Kuningan នៅពេលណា សាលារៀនបិទសម្រាប់ Saraswati និង Pagerwesi នៅពេលណា។","ទាញយក ឬមើលប្រតិទិនផ្លូវការ Sinar Mas Land 2026 និងពិនិត្យថ្ងៃល្អ និងថ្ងៃមិនល្អរបស់ចិន។","បញ្ជីប្រណាំងពេញលេញ កាលបរិច្ឆេទ GP ឥណ្ឌូនេស៊ីនៅ Mandalika និងពេលណាគួរមើល / កក់ការធ្វើដំណើរ។","កាលបរិច្ឆេទ Lebaran ពិតប្រាកដ ឈប់ប៉ុន្មានថ្ងៃ mudik ចាប់ផ្តើមនៅពេលណា រ៉ាម៉ាដនបញ្ចប់នៅពេលណា។","កាលបរិច្ឆេទចាប់ផ្តើម និងបញ្ចប់រ៉ាម៉ាដនពិតប្រាកដ imsakiyah ប្រចាំថ្ងៃ tarawih Laylatul Qadr និងថ្ងៃឈប់សម្រាកសាលារៀន / ការងារ។"],lo:["ຊອກຫາປະຕິທິນ 2026 ທີ່ຖືກຕ້ອງໄດ້ໄວ — ວັນພັກ, ໂຮງຮຽນ, ອິດສະລາມ, ຊາວາ, ບາຫລີ, ວິຊາການ ແລະ ກິດຈະກຳ. ຄລິກບົດຄວາມຂ້າງລຸ່ມເພື່ອເປີດພຽງບົດຄວາມນັ້ນ.","ຄົນສ່ວນໃຫຍ່ຕ້ອງການປະຕິທິນ 2026 ທີ່ເຊື່ອຖືໄດ້ ເພື່ອກວດສອບວັນພັກຍາວ, ວັນພັກໂຮງຮຽນ, ວັນ Ramadan ແລະ Eid, ແລະ ເວລາທີ່ດີທີ່ສຸດທີ່ຈະລາພັກ.","ວັນໃດເປັນວັນພັກແຫ່ງຊາດ, ວັນໃດເປັນວັນພັກລວມ, ແລະ ວັນພັກຍາວໃດທີ່ສາມາດລາໄດ້.","Ramadan ເລີ່ມເມື່ອໃດ, Eid ເມື່ອໃດ, ອົດອາຫານເມື່ອໃດ, ແລະ ວັນພັກຍາວຕົກເມື່ອໃດ.","ຊອກຫາ weton ຂອງທ່ານ, ກວດສອບວັນດີສຳລັບແຕ່ງງານ, ຍ້າຍບ້ານ, ທຸລະກິດ ຫຼື selamatan, ແລະ ຮູ້ວ່າ 1 Suro, Mulud, Ruwah, Poso ແລະ Sawal ຕົກເມື່ອໃດ.","ໂຮງຮຽນເລີ່ມເມື່ອໃດ, ສອບເສັງເມື່ອໃດ, ໃບລາຍງານອອກເມື່ອໃດ, ແລະ ວັນພັກຍາວເມື່ອໃດ.","Bali ງຽບສຳລັບ Nyepi ເມື່ອໃດ, ວັດສະເຫຼີມສະຫຼອງ Galungan ແລະ Kuningan ເມື່ອໃດ, ໂຮງຮຽນປິດສຳລັບ Saraswati ແລະ Pagerwesi ເມື່ອໃດ.","ດາວໂຫຼດ ຫຼື ເບິ່ງປະຕິທິນທາງການ Sinar Mas Land 2026 ແລະ ກວດສອບວັນດີ ແລະ ວັນບໍ່ດີຂອງຈີນ.","ລາຍຊື່ການແຂ່ງຂັນຄົບຖ້ວນ, ວັນແຂ່ງ Indonesian GP ທີ່ Mandalika, ແລະ ເມື່ອໃດຄວນເບິ່ງ / ຈອງການເດີນທາງ.","ວັນ Lebaran ທີ່ແນ່ນອນ, ພັກຈັກມື້, mudik ເລີ່ມເມື່ອໃດ, Ramadan ສິ້ນສຸດເມື່ອໃດ.","ວັນເລີ່ມຕົ້ນ ແລະ ສິ້ນສຸດຂອງ Ramadan ທີ່ແນ່ນອນ, imsakiyah ປະຈຳວັນ, tarawih, Laylatul Qadr, ແລະ ວັນພັກໂຮງຮຽນ / ວຽກ."],my:["မှန်ကန်တဲ့ ၂၀၂၆ ပြက္ခဒိန်ကို အမြန်ရှာပါ — အားလပ်ရက်၊ ကျောင်း၊ အစ္စလာမ်၊ ဂျာဗား၊ ဘာလီ၊ ပညာရေးနဲ့ ပွဲများ။ အဲဒီဆောင်းပါးတစ်ခုတည်းကို ဖွင့်ဖို့ အောက်က ဆောင်းပါးတစ်ခုကို နှိပ်ပါ။","လူအများစုက ရှည်လျားတဲ့ စနေ-တနင်္ဂနွေ၊ ကျောင်းပိတ်ရက်၊ ရမ်ဇာန်နဲ့ အီးဒ်ရက်စွဲတွေ၊ ခွင့်ယူဖို့ အကောင်းဆုံးအချိန်ကို စစ်ဖို့ ယုံကြည်ရတဲ့ ၂၀၂၆ ပြက္ခဒိန်ကို လိုချင်ကြပါတယ်။","ဘယ်ရက်တွေက အမျိုးသားအားလပ်ရက်၊ ဘယ်ရက်တွေက စုပေါင်းခွင့်၊ ဘယ်ရှည်လျားတဲ့ စနေ-တနင်္ဂနွေတွေကို ယူလို့ရလဲ။","ရမ်ဇာန် ဘယ်တော့စမလဲ၊ အီးဒ်က ဘယ်တော့လဲ၊ ဘယ်တော့ ဥပုသ်စောင့်မလဲ၊ ရှည်လျားတဲ့ ပိတ်ရက်တွေက ဘယ်တော့ကျမလဲ။","သင့်ရဲ့ weton ကို ရှာပါ၊ မင်္ဂလာဆောင်၊ အိမ်ပြောင်း၊ စီးပွားရေး ဒါမှမဟုတ် selamatan အတွက် ကောင်းတဲ့နေ့ကို စစ်ပါ၊ 1 Suro, Mulud, Ruwah, Poso နဲ့ Sawal ဘယ်တော့ကျလဲဆိုတာ သိပါ။","ကျောင်း ဘယ်တော့စမလဲ၊ စာမေးပွဲ ဘယ်တော့လဲ၊ အစီရင်ခံစာ ဘယ်တော့ထွက်မလဲ၊ ရှည်လျားတဲ့ ပိတ်ရက် ဘယ်တော့လဲ။","Nyepi အတွက် ဘာလီ ဘယ်တော့ တိတ်ဆိတ်မလဲ၊ ဘုရားကျောင်းတွေက Galungan နဲ့ Kuningan ကို ဘယ်တော့ ကျင်းပမလဲ၊ Saraswati နဲ့ Pagerwesi အတွက် ကျောင်းတွေ ဘယ်တော့ ပိတ်မလဲ။","တရားဝင် Sinar Mas Land ၂၀၂၆ ပြက္ခဒိန်ကို ဒေါင်းလုဒ် ဒါမှမဟုတ် ကြည့်ပြီး တရုတ်ကံကောင်းတဲ့နေ့နဲ့ ကံဆိုးတဲ့နေ့တွေကို စစ်ပါ။","ပြိုင်ပွဲစာရင်း အပြည့်အစုံ၊ မန်ဒါလီကာက အင်ဒိုနီးရှား GP ရက်စွဲ၊ ဘယ်တော့ ကြည့်မလဲ / ခရီးစဉ် ကြိုတင်မှာမလဲ။","Lebaran ရဲ့ တိကျတဲ့ ရက်စွဲ၊ ဘယ်နှရက် ပိတ်မလဲ၊ mudik ဘယ်တော့ စမလဲ၊ ရမ်ဇာန် ဘယ်တော့ ပြီးမလဲ။","ရမ်ဇာန်ရဲ့ တိကျတဲ့ စတင်နဲ့ ပြီးဆုံးရက်စွဲ၊ နေ့စဉ် imsakiyah၊ tarawih၊ Laylatul Qadr၊ ကျောင်း / အလုပ် ပိတ်ရက်များ။"],bn:["সঠিক ২০২৬ ক্যালেন্ডার দ্রুত খুঁজুন — ছুটি, স্কুল, ইসলামিক, জাভানিজ, বালিনিজ, একাডেমিক এবং অনুষ্ঠান। শুধু সেই নিবন্ধটি খুলতে নিচের যেকোনো নিবন্ধে ক্লিক করুন।","বেশিরভাগ মানুষ লম্বা উইকএন্ড, স্কুল ছুটি, রমজান ও ঈদের তারিখ, এবং ছুটি নেওয়ার সেরা সময় দেখতে একটি নির্ভরযোগ্য ২০২৬ ক্যালেন্ডার চান।","কোন তারিখগুলো জাতীয় ছুটি, কোনগুলো যৌথ ছুটি, এবং কোন লম্বা উইকএন্ড নেওয়া যায়।","রমজান কখন শুরু হয়, ঈদ কখন, কখন রোজা রাখতে হয়, এবং লম্বা ছুটি কখন পড়ে।","আপনার weton খুঁজুন, বিয়ে, বাড়ি বদল, ব্যবসা বা selamatan-এর জন্য ভালো দিন দেখুন, এবং জানুন ১ সুরো, মুলুদ, রুয়াহ, পোসো ও সাওয়াল কখন পড়ে।","স্কুল কখন শুরু হয়, পরীক্ষা কখন, রিপোর্ট কার্ড কখন আসে, এবং লম্বা ছুটি কখন।","ন্যেপির জন্য বালি কখন নীরব থাকে, মন্দিরগুলো গালুঙ্গান ও কুনিঙ্গান কখন উদযাপন করে, সরস্বতী ও পাগেরওয়েসির জন্য স্কুল কখন বন্ধ থাকে।","অফিসিয়াল সিনার মাস ল্যান্ড ২০২৬ ক্যালেন্ডার ডাউনলোড বা দেখুন এবং চীনা শুভ ও অশুভ দিন দেখুন।","সম্পূর্ণ রেস তালিকা, মান্ডালিকায় ইন্দোনেশিয়ান জিপির তারিখ, এবং কখন দেখবেন / ভ্রমণ বুক করবেন।","লেবারানের সঠিক তারিখ, কত দিন ছুটি, মুদিক কখন শুরু হয়, রমজান কখন শেষ হয়।","রমজানের সঠিক শুরু ও শেষ তারিখ, দৈনিক ইমসাকিয়া, তারাবিহ, লাইলাতুল কদর, এবং স্কুল / কাজের ছুটি।"],ta:["சரியான 2026 நாட்காட்டியை விரைவாகக் கண்டறியவும் — விடுமுறைகள், பள்ளி, இஸ்லாமிய, ஜாவானிய, பாலினிய, கல்வி மற்றும் நிகழ்வுகள். அந்தக் கட்டுரையை மட்டும் திறக்க கீழே உள்ள ஒரு கட்டுரையைக் கிளிக் செய்யவும்.","பெரும்பாலான மக்கள் நீண்ட வார இறுதிகள், பள்ளி விடுமுறைகள், ரமலான் மற்றும் ஈத் தேதிகள், மற்றும் விடுப்பு எடுக்க சிறந்த நேரத்தைச் சரிபார்க்க நம்பகமான 2026 நாட்காட்டியை விரும்புகிறார்கள்.","எந்த தேதிகள் தேசிய விடுமுறைகள், எவை கூட்டு விடுப்பு, எந்த நீண்ட வார இறுதிகளை எடுக்கலாம்.","ரமலான் எப்போது தொடங்குகிறது, ஈத் எப்போது, எப்போது நோன்பு, நீண்ட விடுமுறைகள் எப்போது வருகின்றன.","உங்கள் weton ஐக் கண்டறியவும், திருமணம், வீடு மாற்றம், வணிகம் அல்லது selamatan க்கு நல்ல நாளைச் சரிபார்க்கவும், 1 Suro, Mulud, Ruwah, Poso மற்றும் Sawal எப்போது வருகின்றன என்பதை அறியவும்.","பள்ளி எப்போது தொடங்குகிறது, தேர்வுகள் எப்போது, அறிக்கை அட்டைகள் எப்போது வருகின்றன, நீண்ட விடுமுறைகள் எப்போது.","Nyepi க்கு பாலி எப்போது அமைதியாக இருக்கிறது, கோயில்கள் Galungan மற்றும் Kuningan ஐ எப்போது கொண்டாடுகின்றன, Saraswati மற்றும் Pagerwesi க்கு பள்ளிகள் எப்போது மூடுகின்றன.","அதிகாரப்பூர்வ Sinar Mas Land 2026 நாட்காட்டியைப் பதிவிறக்கவும் அல்லது பார்க்கவும், சீன அதிர்ஷ்ட மற்றும் துரதிர்ஷ்ட நாட்களைச் சரிபார்க்கவும்.","முழு பந்தயப் பட்டியல், Mandalika இல் இந்தோனேசிய GP தேதி, எப்போது பார்க்க / பயணத்தை முன்பதிவு செய்ய வேண்டும்.","Lebaran இன் சரியான தேதி, எத்தனை நாட்கள் விடுமுறை, mudik எப்போது தொடங்குகிறது, ரமலான் எப்போது முடிகிறது.","ரமலானின் சரியான தொடக்க மற்றும் முடிவு தேதி, தினசரி imsakiyah, tarawih, Laylatul Qadr, மற்றும் பள்ளி / வேலை விடுமுறைகள்."],te:["సరైన 2026 క్యాలెండర్‌ను వేగంగా కనుగొనండి — సెలవులు, పాఠశాల, ఇస్లామిక్, జావనీస్, బాలినీస్, అకడమిక్ మరియు ఈవెంట్‌లు. ఆ వ్యాసాన్ని మాత్రమే తెరవడానికి క్రింద ఉన్న వ్యాసంపై క్లిక్ చేయండి.","చాలా మంది పొడవైన వారాంతాలు, పాఠశాల సెలవులు, రంజాన్ మరియు ఈద్ తేదీలు, సెలవు తీసుకోవడానికి ఉత్తమ సమయాన్ని తనిఖీ చేయడానికి నమ్మదగిన 2026 క్యాలెండర్‌ను కోరుకుంటారు.","ఏ తేదీలు జాతీయ సెలవులు, ఏవి సామూహిక సెలవులు, ఏ పొడవైన వారాంతాలను తీసుకోవచ్చు.","రంజాన్ ఎప్పుడు ప్రారంభమవుతుంది, ఈద్ ఎప్పుడు, ఎప్పుడు ఉపవాసం, పొడవైన సెలవులు ఎప్పుడు వస్తాయి.","మీ weton ను కనుగొనండి, పెళ్లి, ఇల్లు మారడం, వ్యాపారం లేదా selamatan కోసం మంచి రోజును తనిఖీ చేయండి, 1 Suro, Mulud, Ruwah, Poso మరియు Sawal ఎప్పుడు వస్తాయో తెలుసుకోండి.","పాఠశాల ఎప్పుడు ప్రారంభమవుతుంది, పరీక్షలు ఎప్పుడు, రిపోర్ట్ కార్డులు ఎప్పుడు వస్తాయి, పొడవైన సెలవులు ఎప్పుడు.","Nyepi కోసం బాలి ఎప్పుడు నిశ్శబ్దంగా ఉంటుంది, దేవాలయాలు Galungan మరియు Kuningan ను ఎప్పుడు జరుపుకుంటాయి, Saraswati మరియు Pagerwesi కోసం పాఠశాలలు ఎప్పుడు మూసివేయబడతాయి.","అధికారిక Sinar Mas Land 2026 క్యాలెండర్‌ను డౌన్‌లోడ్ చేయండి లేదా చూడండి, చైనీస్ అదృష్ట మరియు దురదృష్ట రోజులను తనిఖీ చేయండి.","పూర్తి రేస్ జాబితా, Mandalika లో ఇండోనేషియా GP తేదీ, ఎప్పుడు చూడాలి / ప్రయాణం బుక్ చేయాలి.","Lebaran యొక్క ఖచ్చితమైన తేదీ, ఎన్ని రోజులు సెలవు, mudik ఎప్పుడు ప్రారంభమవుతుంది, రంజాన్ ఎప్పుడు ముగుస్తుంది.","రంజాన్ యొక్క ఖచ్చితమైన ప్రారంభ మరియు ముగింపు తేదీ, రోజువారీ imsakiyah, tarawih, Laylatul Qadr, పాఠశాల / పని సెలవులు."],ur:["صحیح 2026 کیلنڈر جلدی تلاش کریں — چھٹیاں، اسکول، اسلامی، جاوانی، بالینی، تعلیمی اور تقریبات۔ صرف وہ مضمون کھولنے کے لیے نیچے کسی مضمون پر کلک کریں۔","زیادہ تر لوگ لمبے ویک اینڈ، اسکول کی چھٹیوں، رمضان اور عید کی تاریخوں، اور چھٹی لینے کے بہترین وقت کی جانچ کے لیے قابل اعتماد 2026 کیلنڈر چاہتے ہیں۔","کون سی تاریخیں قومی چھٹیاں ہیں، کون سی اجتماعی چھٹیاں، اور کون سے لمبے ویک اینڈ لیے جا سکتے ہیں۔","رمضان کب شروع ہوتا ہے، عید کب ہے، کب روزہ رکھنا ہے، اور لمبی چھٹیاں کب پڑتی ہیں۔","اپنا weton تلاش کریں، شادی، گھر بدلنے، کاروبار یا selamatan کے لیے اچھا دن دیکھیں، اور جانیں کہ 1 Suro, Mulud, Ruwah, Poso اور Sawal کب پڑتے ہیں۔","اسکول کب شروع ہوتا ہے، امتحانات کب ہیں، رپورٹ کارڈ کب آتے ہیں، اور لمبی چھٹیاں کب ہیں۔","Nyepi کے لیے بالی کب خاموش رہتا ہے، مندر Galungan اور Kuningan کب مناتے ہیں، Saraswati اور Pagerwesi کے لیے اسکول کب بند رہتے ہیں۔","سرکاری Sinar Mas Land 2026 کیلنڈر ڈاؤن لوڈ یا دیکھیں اور چینی خوش قسمت اور بد قسمت دن دیکھیں۔","مکمل ریس فہرست، Mandalika میں انڈونیشیائی GP کی تاریخ، اور کب دیکھنا / سفر بک کرنا ہے۔","Lebaran کی درست تاریخ، کتنے دن چھٹی، mudik کب شروع ہوتا ہے، رمضان کب ختم ہوتا ہے۔","رمضان کے شروع اور ختم ہونے کی درست تاریخ، روزانہ imsakiyah، تراویح، لیلۃ القدر، اور اسکول / کام کی چھٹیاں۔"],ko:["맞는 2026 달력을 빨리 찾으세요 — 휴일, 학교, 이슬람, 자바, 발리, 학사 및 행사. 아래 글 중 하나를 클릭하면 해당 글만 열립니다.","대부분의 사람들은 긴 주말, 학교 방학, 라마단과 Eid 날짜, 휴가를 내기 가장 좋은 시기를 확인할 수 있는 믿을 수 있는 2026 달력을 원합니다.","어떤 날짜가 공휴일이고, 어떤 날짜가 공동 휴가이며, 어떤 긴 주말을 쉴 수 있는지.","라마단은 언제 시작하고, Eid는 언제이며, 언제 단식하고, 긴 휴가는 언제인지.","weton을 찾고, 결혼, 이사, 사업 또는 selamatan에 좋은 날을 확인하고, 1 Suro, Mulud, Ruwah, Poso, Sawal이 언제인지 알아보세요.","학교는 언제 시작하고, 시험은 언제이며, 성적표는 언제 나오고, 긴 방학은 언제인지.","Nyepi 때 발리는 언제 조용해지고, 사원은 Galungan과 Kuningan을 언제 기념하며, 학교는 Saraswati와 Pagerwesi 때 언제 닫는지.","공식 Sinar Mas Land 2026 달력을 다운로드하거나 보고 중국 길일과 흉일을 확인하세요.","전체 레이스 목록, Mandalika 인도네시아 GP 날짜, 언제 시청 / 여행을 예약할지.","정확한 Lebaran 날짜, 며칠 쉬는지, mudik은 언제 시작하고, 라마단은 언제 끝나는지.","라마단의 정확한 시작과 종료 날짜, 매일 imsakiyah, tarawih, Laylatul Qadr, 학교 / 직장 휴일."]},Sr=(e,n)=>{if(e===0)return ad[n]?.[0]??qv;return ad[n]?.[e]??Yv(e)},xv={id:["Kalender 2026","Kalender hari libur nasional Indonesia 2026","Kalender Islam 2026","Kalender Jawa 2026","Kalender sekolah 2026","Kalender Bali 2026","Kalender Sinar Mas 2026","Kalender MotoGP 2026","Kalender Idul Fitri 2026","Kalender Ramadan 2026"],ms:["Kalendar 2026","Kalendar cuti umum Indonesia 2026","Kalendar Islam 2026","Kalendar Jawa 2026","Kalendar sekolah 2026","Kalendar Bali 2026","Kalendar Sinar Mas 2026","Kalendar MotoGP 2026","Kalendar Aidilfitri 2026","Kalendar Ramadan 2026"],jv:["Kalender 2026","Kalender preian nasional Indonesia 2026","Kalender Islam 2026","Kalender Jawa 2026","Kalender sekolah 2026","Kalender Bali 2026","Kalender Sinar Mas 2026","Kalender MotoGP 2026","Kalender Lebaran 2026","Kalender Ramadan 2026"],su:["Kalénder 2026","Kalénder libur nasional s applied, it is normally deducted from the employee's annual leave entitlement. If an employee works on a cuti bersama day that the company has adopted, that day is generally paid as a normal working day rather than as a holiday overtime day."}),a("aside",{className:"my-6 border-l-4 border-[var(--primary)] bg-[var(--primary-soft)] px-5 py-4 font-ui text-[0.95rem] leading-relaxed",children:[l("strong",{children:"Check before you assume:"})," always confirm whether your employer follows all cuti bersama days, and whether those days are deducted from your annual leave. The decree sets the national schedule; your contract and company policy decide how it applies to you."]}),l("p",{children:"In practice, the simplest way to read the calendar is this: libur nasional is a holiday for everyone, and cuti bersama is a government-set bridge day that many — but not all — workplaces also treat as leave. If you are planning travel or an event, confirm the cuti bersama position with your employer or school first."}),l("h2",{id:"long-weekends",children:"Long Weekends 2026"}),l("p",{children:"The longest break of the year is in March. The other long weekends are shorter, but they are spread across the year, so there is at least one good opportunity to travel or rest in most seasons."}),a("ul",{children:[a("li",{children:[l("strong",{children:"14–17 February — Chinese New Year, 4 days:"})," Saturday 14 February, Sunday 15 February, cuti bersama on Monday 16 February, and Chinese New Year on Tuesday 17 February."]}),a("li",{children:[l("strong",{children:"18–24 March — Nyepi + Eid al-Fitr, 7 days:"})," cuti bersama on Wednesday 18 March, Nyepi on Thursday 19 March, cuti bersama on Friday 20 March, Eid al-Fitr on Saturday 21 March and Sunday 22 March, and cuti bersama on Monday 23 March and Tuesday 24 March."]}),a("li",{children:[l("strong",{children:"14–17 May — Ascension Day, 4 days:"})," Ascension Day on Thursday 14 May, cuti bersama on Friday 15 May, then Saturday 16 May and Sunday 17 May."]}),a("li",{children:[l("strong",{children:"24–27 December — Christmas, 4 days:"})," cuti bersama on Thursday 24 December, Christmas Day on Friday 25 December, then Saturday 26 December and Sunday 27 December."]})]}),l("p",{children:"There are also useful shorter breaks that need no cuti bersama. Labour Day gives 1–3 May, from Friday to Sunday. Good Friday and Easter give 3–5 April, from Friday to Sunday. Independence Day gives 15–17 August, from Saturday to Monday. Pancasila Day gives 30 May–1 June, from Saturday to Monday, because Vesak falls on Sunday 31 May."}),l("p",{children:"Eid al-Adha can also become a longer break. Eid al-Adha is on Wednesday 27 May, with cuti bersama on Thursday 28 May. Taking Friday 29 May as annual leave turns it into a five-day break from Wednesday 27 May to Sunday 31 May, ending with Vesak on the Sunday. That is the kind of trade-off to weigh early: one day of annual leave buys three extra days away when it sits between a cuti bersama day and a weekend."}),a("p",{children:[l("strong",{children:"Planning tip:"})," book the March break and the Christmas break first. They are the longest and the most popular, so transport, accommodation, and family plans fill up earliest around them. The February and May long weekends are good alternatives if you prefer quieter travel."]}),l("h2",{id:"month-by-month",children:"Month-by-Month Holidays"}),l("p",{children:"Use this month-by-month view to spread leave across the year instead of using it all in one season. Four months — July, September, October, and November — have no red dates at all, which makes them useful for focused work and for trips that avoid holiday crowds."}),l("div",{className:"my-6 grid gap-3 font-ui sm:grid-cols-2",children:o1.map(([n,t])=>a("div",{className:"border border-[var(--line)] bg-[var(--surface)] p-4",children:[l("div",{className:"text-[12px] font-bold uppercase tracking-[0.16em] text-[var(--primary)]",children:n}),l("p",{className:"m-0 mt-2 !text-[14px] leadi H · 2026"]}),a("span",{className:"inline-flex items-center gap-2",children:[l(oe,{size:16})," Ramadan from 19 Feb · Eid al-Fitr 21–22 Mar"]}),a("span",{className:"inline-flex items-center gap-2",children:[l(pe,{size:16})," Indonesia"]})]})]}),l(nn,{n:3}),l("p",{className:"mt-8",children:"The Islamic calendar covers the end of Hijri year 1447 H and the start of 1448 H in 2026, and 1448 H into 1449 H in 2027. In Indonesia, the key official 2026 dates are Isra Mi'raj on 16 January 2026, Ramadan starting around 18–19 February 2026, Eid al-Fitr (Idul Fitri) on 21–22 March 2026, Eid al-Adha (Idul Adha) on 27 May 2026, Islamic New Year 1 Muharram 1448 H on 16 June 2026, and Prophet Muhammad's Birthday (Maulid Nabi) on 25 August 2026, all based on the SKB 3 Menteri decree and confirmed by the Ministry of Religious Affairs isbat session."}),l("p",{children:"Most people searching for this want to know when Ramadan starts, when Eid is, when to fast, and when the long holidays fall, so they can plan fasting, tarawih, mudik, zakat, qurban, school and work leave. This article gives you the full month-by-month Hijri to Gregorian conversion, the holy nights, the fasting calendar, and the official Indonesian dates."}),l("p",{children:"The Islamic calendar is a lunar calendar with 12 months of 29 or 30 days, about 354–355 days in a year, which is why Hijri dates move about 10–11 days earlier each Gregorian year. A new month begins with the sighting of the hilal crescent moon, so final Indonesian dates are confirmed by Kemenag through isbat."}),l("div",{className:"my-8 grid gap-3 font-ui sm:grid-cols-3",children:[["19 Feb","1 Ramadan 1447 H in Indonesia"],["21–22 Mar","Eid al-Fitr 1447 H"],["27 May","Eid al-Adha 1447 H"]].map(([n,t])=>a("div",{className:"border border-[var(--line)] bg-[var(--surface-muted)] px-4 py-4",children:[l("div",{className:"text-[2rem] font-bold leading-none tracking-tight",children:n}),l("div",{className:"mt-2 text-[13px] text-[var(--text-muted)]",children:t})]},t))}),l("h2",{id:"complete-list",children:"Complete List: Important Islamic Dates 2026"}),l("p",{children:"Use this table as the master list for 2026. The Hijri date is the religious date; the Gregorian date is the calendar date used for school, work, travel, and leave in Indonesia."}),l("div",{className:"my-6 overflow-x-auto border border-[var(--line)] font-ui",children:a("table",{className:"w-full min-w-[620px] border-collapse text-left",children:[l("thead",{children:a("tr",{className:"bg-[var(--text)] text-[var(--surface)]",children:[l("th",{className:"px-4 py-3 text-[13px] font-bold uppercase tracking-wide",children:"Hijri"}),l("th",{className:"px-4 py-3 text-[13px] font-bold uppercase tracking-wide",children:"Gregorian"}),l("th",{className:"px-4 py-3 text-[13px] font-bold uppercase tracking-wide",children:"Event"})]})}),l("tbody",{children:f1.map(([n,t,r],u)=>a("tr",{className:u%2?"bg-[var(--surface-muted)]":"bg-[var(--surface)]",children:[l("td",{className:"border-t border-[var(--line)] px-4 py-3 font-bold whitespace-nowrap",children:n}),l("td",{className:"border-t border-[var(--line)] px-4 py-3 whitespace-nowrap",children:t}),l("td",{className:"border-t border-[var(--line)] px-4 py-3",children:r})]},n+r))})]})}),l("p",{className:"font-ui !text-[0.9rem] text-[var(--text-muted)]",children:"Read the Ramadan row carefully: 18 February is the astronomical calculation, while 19 February is the Indonesian isbat date used for the official calendar. Plan fasting from the isbat date unless your organisation follows a different determination."}),l("h2",{id:"ramadan",children:"Ramadan 2026 in Indonesia"}),l("p",{children:"Ramadan 1447 H begins on 19 February 2026 in Indonesia, according to the isbat determination, and runs to about 20 March 2026. That makes the first fast on Thursday 19 February, with the first tarawih prayer on the night before, on Wednesday 18 February. Because the month is lunar, the exact start is confirmed close to the date — but the official calendar gives families, schools, mosques, and workplaces a firm date to plan around."}),l("h3",{children:"Fasting start, sahur, and iftar"}),l("p",{children:"The daily rhythm of Ramadan is simple to describe and demanding to keep: sahur before dawn, fasting from imsak to maghrib, then iftar to break the fast. In practice, the dates matter less than the routine. Set sahur and iftar times from the prayer schedule for your city, because imsak and maghrib shift with location and with the season. February and March fall in the rainy season in much of Indonesia, so travel to tarawih, work, and school can take longer than usual — build that buffer into the first week rather than discovering it on the first night."}),l("h3",{children:"Tarawih, Nuzulul Quran, and Laylatul Qadr"}),l("p",{children:"Tarawih is prayed nightly through Ramadan, usually after Isya at the mosque or at home. Nuzulul Quran falls on 17 Ramadan, or 7 March 2026, and is a moment many communities mark with study and reflection on the revelation of the Quran. The last 10 nights, from 21 to 29 Ramadan, or 11 to 19 March 2026, are the period when many Muslims increase worship in the search for Laylatul Qadr, the Night of Decree. That is why the final stretch of Ramadan often feels different from the start: more night prayer, more Quran reading, more charity, and — for many families — more time together after iftar."}),l("h3",{children:"Zakat fitrah, mudik, and cuti bersama"}),l("p",{children:"Zakat fitrah is paid before Eid al-Fitr prayer, so the last days of Ramadan are also the deadline for arranging it through a mosque, amil, or trusted channel. The same week is the start of mudik, the journey home for Eid. The official calendar helps here: cuti bersama falls on 18, 20, 23, and 24 March, around Nyepi on 19 March and Eid al-Fitr on 21–22 March. Together with the weekend, that creates a seven-day stretch from 18 to 24 March. Book transport and accommodation early, confirm who is travelling on which day, and leave a margin for delays — the roads, stations, ports, and airports are at their busiest in this window."}),a("aside",{className:"my-6 border-l-4 border-[var(--primary)] bg-[var(--primary-soft)] px-5 py-4 font-ui text-[0.95rem] leading-relaxed",children:[l("strong",{children:"Planning tip:"})," treat the last week of Ramadan as two plans at once — a worship plan for the last 10 nights, and a travel plan for mudik. Decide early which nights you will stay home, which days you will travel, and when zakat fitrah will be paid, so one plan does not crowd out the other."]}),l("h2",{id:"eid",children:"Eid al-Fitr and Eid al-Adha 2026"}),l("p",{children:"Eid al-Fitr falls on 21–22 March 2026, marking the end of Ramadan 1447 H. The first day, 1 Syawal, is Saturday 21 March; the second day, 2 Syawal, is Sunday 22 March. Both days are national holidays, and the surrounding cuti bersama days turn the period into the longest break of the year. Eid al-Adha falls later, on 27 May 2026, or 10 Dzulhijjah 1447 H, with cuti bersama on Thursday 28 May."}),l("h3",{children:"Eid al-Fitr: shalat Ied and zakat"}),l("p",{children:"Eid al-Fitr begins with shalat Ied in the morning, usually at a mosque or open field, followed by the sermon, family visits, and halal bihalal. Zakat fitrah should already be paid before the prayer. Because Eid falls on a Saturday and Sunday in 2026, many families will have the weekend built in — the question is not whether there is time to gather, but how to share it fairly between two sides of the family, and when to travel back before work and school resume."}),l("h3",{children:"Eid al-Adha: qurban and the Tasyrik days"}),l("p",{children:"Eid al-Adha is the festival of sacrifice. After shalat Ied, qurban animals are slaughtered and the meat is distributed to family, neighbours, and people in need. The three Tasyrik days follow, from 11 to 13 Dzulhijjah, or 28 to 30 May 2026. Fasting is not observed on Eid al-Adha or during the Tasyrik days. For families planning qurban, the practical steps come well before the day itself: decide who is participating, arrange the animal or a trusted qurban channel, confirm the distribution plan, and check school and work schedules, since Eid al-Adha sits close to the end of the school term in many areas."}),a("p",{children:[l("strong",{children:"Planning tip:"})," Eid al-Adha can become a longer break with one extra day. Eid al-Adha is on Wednesday 27 May, with cuti bersama on Thursday 28 May. Taking Friday 29 May as annual leave creates a five-day break from Wednesday 27 May to Sunday 31 May, ending with Vesak on the Sunday."]}),l("h2",{id:"sunnah-fasting",children:"Sunnah Fasting Calendar 2026"}),l("p",{children:"Outside Ramadan, fasting in the Islamic calendar follows a few simple rhythms: weekly fasts, monthly fasts, and fasts tied to particular days. The weekly pattern is fasting on Mondays and Thursdays. The monthly pattern is Ayyamul Bidh — the white days — on the 13th, 14th, and 15th of each Hijri month, when the moon is fullest. Around those two patterns sit the special fasts of the year: Syawal, Arafah, Tasua and Ashura, and the early days of Dzulhijjah."}),l("p",{children:"The six days of Syawal fasting begin after Eid al-Fitr, from 6 Syawal, or 26 March 2026. They do not have to be consecutive, and they do not have to start on the first possible day, which gives families flexibility in the busy week after mudik. In Dzulhijjah, the first nine days are a recommended period for fasting, with the Day of Arafah on 9 Dzulhijjah, or 26 May 2026, as the most emphasised day for those not performing Hajj. In Muharram, the recommended fasts are Tasua on 9 Muharram and Ashura on 10 Muharram, or 24 and 25 June 2026."}),l("p",{children:"Two boundaries matter for planning. Fasting is not observed on Eid al-Fitr, Eid al-Adha, and the Tasyrik days. And in Syawal, a person with outstanding Ramadan fasts to make up will usually prioritise the obligatory make-up fasts first — check with a trusted religious teacher if you are unsure how to order them in your situation."}),l("div",{className:"my-6 overflow-x-auto border border-[var(--line)] font-ui",children:a("table",{className:"w-full min-w-[560px] border-collapse text-left",children:[l("thead",{children:a("tr",{className:"bg-[var(--text)] text-[var(--surface)]",children:[l("th",{className:"px-4 py-3 text-[13px] font-bold uppercase tracking-wide",children:"Period"}),l("th",{className:"px-4 py-3 text-[13px] font-bold uppercase tracking-wide",children:"Gregorian"}),l("th",{className:"px-4 py-3 text-[13px] font-bold uppercase tracking-wide",children:"Fasts to note"})]})}),l("tbody",{children:d1.map(([n,t,r],u)=>a("tr",{className:u%2?"bg-[var(--surface-muted)]":"bg-[var(--surface)]",children:[l("td",{className:"border-t border-[var(--line)] px-4 py-3 font-bold whitespace-nowrap",children:n}),l("td",{className:"border-t border-[var(--line)] px-4 py-3 whitespace-nowrap",children:t}),l("td",{className:"border-t border-[var(--line)] px-4 py-3",children:r})]},n))})]})}),l("p",{className:"font-ui !text-[0.9rem] text-[var(--text-muted)]",children:"For exact Ayyamul Bidh dates in a given month, count 13, 14, and 15 from the first day of that Hijri month in the table below."}),l("h2",{id:"month-by-month",children:"Month-by-Month Hijri to Gregorian 2026"}),l("p",{children:"Twelve Hijri months overlap the Gregorian year 2026. The first six belong to 1447 H; the next six open 1448 H. The ranges below are approximate, because a Hijri month is 29 or 30 days and its start depends on the hilal. Use them to place a Hijri date inside the right Gregorian month, then confirm the exact day with the isbat announcement or your local calendar."}),l("div",{className:"my-6 grid gap-3 font-ui sm:grid-cols-2",children:c1.map(([n,t,r])=>a("div",{className:"border border-[var(--line)] bg-[var(--surface)] p-4",children:[l("div",{className:"text-[12px] font-bold uppercase tracking-[0.16em] text-[var(--primary)]",children:n}),l("div",{className:"mt-1 text-[13px] font-bold",children:t}),l("p",{className:"m-0 mt-2 !text-[14px] leading-relaxed text-[var(--text-muted)]",children:r})]},n))}),l("p",{children:"The pattern to remember is the drift: because the Hijri year is about 10–11 days shorter than the Gregorian year, every Hijri month in 2026 starts earlier in the Gregorian calendar than it did in 2025 — and will start earlier again in 2027. That is why Ramadan, which began in early March in 2025, begins in mid-to-late February in 2026."}),l("h2",{id:"how-dates-decided",children:"How Dates Are Decided: Hisab, Rukyat and Isbat"}),l("p",{children:"Three words explain almost every difference you will see between Islamic calendars: hisab, rukyat, and isbat. Hisab is calculation — working out the position of the moon from astronomy. Rukyat is observation — looking for the hilal crescent moon in the sky. Isbat is determination — the official decision that turns calculation and observation into the date a country follows."}),l("h3",{children:"Why dates can differ by one day"}),l("p",{children:"Two groups can use the same astronomy and still land on different days, because they use different thresholds for when the crescent counts as visible, observe from different locations, or decide by calculation alone versus observation. Weather matters too: cloud over one observation point can change what is reported. That is why a date in Indonesia can differ by one day from a date in another country, and why it can differ between organisations inside Indonesia."}),l("h3",{children:"Muhammadiyah, NU, and the government"}),l("p",{children:"In Indonesia, Muhammadiyah generally determines the start of the Hijri months by hisab, while Nahdlatul Ulama (NU) generally emphasises rukyat, the sighting of the hilal. The government, through Kemenag, brings calculation, observation reports, and religious leaders together in an isbat session and announces the official date used for national holidays and the state calendar. In most years the methods agree; in some years they differ by a day. When they differ, families, schools, and mosques may start Ramadan or celebrate Eid on different days — and the practical answer is to follow the determination your family, mosque, school, or workplace has announced, and to respect the other determination without treating the difference as an error."}),a("aside",{className:"my-6 border-l-4 border-[var(--primary)] bg-[var(--primary-soft)] px-5 py-4 font-ui text-[0.95rem] leading-relaxed",children:[l("strong",{children:"Before you book:"})," for travel, leave, and events tied to Ramadan or Eid, use the government isbat dates first, then check the announcement from your own organisation. A one-day difference matters most in the week of the holiday, when transport and accommodation are already full."]}),l("h2",{id:"source-note",children:"Source Note"}),l("p",{children:"The official Indonesian dates in this article follow the SKB 3 Menteri joint decree No. 1497/2025, No. 2/2025 and No. 5/2025, signed 19 September 2025, and the Ministry of Religious Affairs (Kemenag) isbat process that confirms the Hijri dates for Indonesia."}),l("p",{children:"Astronomical dates may differ by one day from the isbat dates. The clearest example in 2026 is the start of Ramadan: astronomical calculation points to 18 February 2026, while the Indonesian isbat date in the official calendar is 19 February 2026. Where this article shows both, the isbat date is the one to use for official planning in Indonesia. For dates outside the SKB list, treat the Hijri-to-Gregorian conversions as approximate and confirm them with the isbat announcement or your local religious authority before making non-refundable plans."}),a("div",{className:"mt-10 border border-[var(--line)] bg-[var(--surface-muted)] p-5 font-ui",children:[l("p",{className:"m-0 !text-[13px] font-bold uppercase tracking-[0.18em] text-[var(--text-muted)]",children:"Next in the series"}),a("button",{onClick:()=>e(4),className:"mt-2 flex w-
